        clearHistoryInfo: "Damit werden alle bisher gezogenen Ergebnisse gelöscht. Ohne Verlauf hat „Zuletzt gewählte meiden“ keine Grundlage mehr, und alle Lokale haben wieder die gleiche Chance.",
        count: function (n) { return n === 1 ? "1 Lokal" : n + " Lokale"; },
        remove: function (name) { return name + " entfernen"; },
        result: function (name) { return "Ergebnis: " + name; }
      }
    };

    var groups = [];         // [{ name, items, skipped, skipDate, history }]
    var active = 0;          // 지금 보고 있는 카테고리

    var items = [];
    var skipped = [];        // 오늘만 빼둔 곳
    var skipDate = "";       // 그 제외가 유효한 날짜
    var history = [];
    var lang = "ko";
    var theme = "paper";
    var hintKey = "hintStart";
    var hintWarn = false;
    var soundOn = true;
    var rot = 0;
    var spinning = false;
    var weighted = true;
    var mode = "wheel";      // wheel | ladder

    /* 최근 1·2·3번째 결과에 곱하는 배수. 그 이전은 1 */
    var DECAY = [0.25, 0.5, 0.75];

    function S() { return STRINGS[lang] || STRINGS.en; }

    var canvas = document.getElementById("wheel");
    var ctx = canvas.getContext("2d");
    var hub = document.getElementById("hub");
    var spinBtn = document.getElementById("spin");
    var reshuffleBtn = document.getElementById("reshuffle");
    var needle = document.getElementById("needle");
    var modeSwitch = document.getElementById("mode-switch");
    var hint = document.getElementById("hint");
    var listEl = document.getElementById("list");
    var tabsEl = document.getElementById("tabs");
    var emptyEl = document.getElementById("empty");
    var skipTray = document.getElementById("skip-tray");
    var trayList = document.getElementById("tray-list");
    var countEl = document.getElementById("count");
    var chipsEl = document.getElementById("history-chips");
    var emptyHistEl = document.getElementById("history-empty");
    var clearHistBtn = document.getElementById("clear-history");
    var historyNote = document.getElementById("history-note");
    var infoBtn = document.getElementById("history-info");
    var input = document.getElementById("name");
    var overlay = document.getElementById("overlay");
    var resultName = document.getElementById("result-name");
    var resultMeta = document.getElementById("result-meta");
    var shotCanvas = document.getElementById("result-shot");
    var resultEyebrow = document.getElementById("result-eyebrow");
    var lastResult = null;
    var shownResult = null;
    var shareOut = document.getElementById("share-out");
    var shareBtn = document.getElementById("share");
    var weightBtn = document.getElementById("weight");
    var themeBtn = document.getElementById("theme-toggle");
    var themeMenu = document.getElementById("theme-menu");
    var langBtn = document.getElementById("lang-toggle");
    var langMenu = document.getElementById("lang-menu");
    var langCode = document.getElementById("lang-code");
    var live = document.getElementById("live");

    /* ── theme + font values read from CSS ── */
    var css = {};
    function readTheme() {
      var s = getComputedStyle(document.documentElement);
      ["--surface", "--ground", "--ink", "--ink-3", "--line", "--line-strong", "--body"].forEach(function (k) {
        css[k] = s.getPropertyValue(k).trim();
      });
    }

    function wheelFont(weight, size) {
      return weight + " " + size + "px " + (css["--body"] || "system-ui, sans-serif");
    }

    /* ── color helpers ── */
    function colorFor(i, n) {
      var idx = i % PALETTE.length;
      // 마지막 조각이 첫 조각과 붙어 같은 색이 되는 경우만 비켜준다
      if (i === n - 1 && idx === 0 && n > 1) idx = Math.floor(PALETTE.length / 2);
      return PALETTE[idx];
    }

    /* ── 오늘의 결정: 날짜와 목록에서 난수를 만들어 모두 같은 결과를 보게 한다 ── */
    function seedFrom(text) {
      // FNV-1a 32비트
      var h = 2166136261;
      for (var i = 0; i < text.length; i++) {
        h ^= text.charCodeAt(i);
        h = (h + ((h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24))) >>> 0;
      }
      return h >>> 0;
    }

    /* 같은 씨앗이면 언제 어디서 돌려도 같은 값.
       하루 차이처럼 비슷한 씨앗이 비슷한 결과로 뭉치지 않도록 두 번 섞는다 */
    function seededRandom(seed) {
      var z = (seed + 0x9E3779B9) >>> 0;
      z = Math.imul(z ^ (z >>> 16), 0x21F0AAAD) >>> 0;
      z = Math.imul(z ^ (z >>> 15), 0x735A2D97) >>> 0;
      z = (z ^ (z >>> 15)) >>> 0;
      return z / 4294967296;
    }

    /* ── 카테고리 ──
       화면이 쓰는 items/skipped/history 는 '지금 보고 있는 카테고리'의 값이다.
       전환하거나 저장할 때 그 값을 해당 카테고리에 담아 둔다 */
    function commitGroup() {
      if (!groups[active]) return;
      groups[active].items = items;
      groups[active].skipped = skipped;
      groups[active].skipDate = skipDate;
      groups[active].history = history;
    }

    function loadGroup(i) {
      var g = groups[i];
      if (!g) return;
      active = i;
      items = g.items || [];
      skipped = g.skipDate === today() ? (g.skipped || []) : [];
      skipDate = g.skipDate || "";
      history = (g.history || []).slice(0, DECAY.length);
    }

    function switchGroup(i) {
      if (i === active || !groups[i] || spinning) return;
      commitGroup();
      loadGroup(i);
      if (mode === "ladder") buildLadder();
      setHint(activeItems().length < 2 ? "hintStart" : "hintReady", false);
      renderTabs();
      renderHistory();
      render();
      save();
    }

    function addGroup(name) {
      commitGroup();
      groups.push({ name: name, items: [], skipped: [], skipDate: "", history: [] });
      loadGroup(groups.length - 1);
      renderTabs();
      renderHistory();
      render();
      save();
    }

    function removeGroup(i) {
      if (groups.length < 2 || !groups[i]) return;
      groups.splice(i, 1);
      loadGroup(Math.max(0, Math.min(active > i ? active - 1 : active, groups.length - 1)));
      if (mode === "ladder") buildLadder();
      renderTabs();
      renderHistory();
      render();
      save();
    }

    function renameGroup(i, name) {
      var clean = String(name).trim().slice(0, 14);
      if (!clean || !groups[i]) return;
      groups[i].name = clean;
      renderTabs();
      save();
    }

    /* ── 사다리타기 ──
       가로선은 (열, 행) 칸에 놓인다. 같은 행의 이웃 칸이 차 있으면 경로가 모호해지므로 막는다 */
    var ladder = { rows: 0, cols: 0, names: [], rungs: {}, path: null, progress: 1, start: -1 };

    function rungKey(c, r) { return c + ":" + r; }
    function hasRung(c, r) { return ladder.rungs[rungKey(c, r)] === true; }

    function canPlace(c, r) {
      return c >= 0 && c < ladder.cols - 1 && r >= 0 && r < ladder.rows &&
             !hasRung(c - 1, r) && !hasRung(c + 1, r);
    }

    function buildLadder(seed) {
      var names = activeItems();
      var n = names.length;
      var rows = Math.max(6, Math.min(12, n * 2));
      // 씨앗을 남겨두면 같은 사다리를 언제든 다시 그릴 수 있다 (결과 공유에 쓰인다)
      var use = typeof seed === "number" ? seed >>> 0 : Math.floor(Math.random() * 4294967296) >>> 0;
      ladder = { rows: rows, cols: n, names: names, rungs: {}, path: null, progress: 1, start: -1, seed: use };
      if (n < 2) return;

      var step = 0;
      var rnd = function () { return seededRandom((use + (step++) * 0x9E3779B9) >>> 0); };
      for (var r = 0; r < rows; r++) {
        for (var c = 0; c < n - 1; c++) {
          if (rnd() < 0.42 && canPlace(c, r)) ladder.rungs[rungKey(c, r)] = true;
        }
      }
    }

    function toggleRung(c, r) {
      var key = rungKey(c, r);
      if (ladder.rungs[key]) delete ladder.rungs[key];
      else if (canPlace(c, r)) ladder.rungs[key] = true;
      else return false;
      ladder.path = null;
      drawLadder();
      return true;
    }

    /* 출발 열에서 아래로 내려가며 만나는 가로선마다 옆으로 건너간다 */
    function tracePath(start) {
      var c = start;
      var pts = [{ c: c, r: 0 }];
      for (var r = 0; r < ladder.rows; r++) {
        if (hasRung(c, r)) { c += 1; pts.push({ c: c, r: r }); }
        else if (hasRung(c - 1, r)) { c -= 1; pts.push({ c: c, r: r }); }
      }
      pts.push({ c: c, r: ladder.rows });
      return { pts: pts, end: c };
    }

    /* ── 오늘만 빼기 ── */
    function today() {
      var d = new Date();
      return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
    }

    function isSkipped(name) {
      return skipped.indexOf(name) !== -1;
    }

    /* 오늘 원판에 올라갈 후보 */
    function activeItems() {
      return items.filter(function (n) { return !isSkipped(n); });
    }

    function toggleSkip(name) {
      var at = skipped.indexOf(name);
      if (at === -1) skipped.push(name); else skipped.splice(at, 1);
      skipDate = today();
      render();
      var n = activeItems().length;
      setHint(n < 2 ? "hintAllSkipped" : "hintReady", n < 2);
      save();
    }

    /* ── 가중치: 최근에 나온 곳일수록 낮게 ── */
    function weightOf(name) {
      if (!weighted) return 1;
      var at = history.indexOf(name);
      return at === -1 ? 1 : (DECAY[at] || 1);
    }

    /* 조각 시작 각도와 폭을 가중치 비율 그대로 계산한다.
       추첨과 그리기가 같은 표를 쓰므로 보이는 넓이 = 실제 확률 */
    function layout() {
      var names = activeItems();
      var w = names.map(weightOf);
      var total = 0;
      var i;
      for (i = 0; i < w.length; i++) total += w[i];
      if (total <= 0) total = 1;

      var starts = [];
      var acc = 0;
      for (i = 0; i < w.length; i++) {
        starts.push(acc / total * TAU);
        acc += w[i];
      }
      return {
        names: names,
        w: w,
        total: total,
        starts: starts,
        angle: function (k) { return w[k] / total * TAU; }
      };
    }

    function wedgeAt(at, L) {
      var u = norm(-at);
      for (var i = L.starts.length - 1; i >= 0; i--) {
        if (u >= L.starts[i]) return i;
      }
      return 0;
    }

    function relLum(hex) {
      var r = parseInt(hex.slice(1, 3), 16) / 255;
      var g = parseInt(hex.slice(3, 5), 16) / 255;
      var b = parseInt(hex.slice(5, 7), 16) / 255;
      function lin(c) { return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); }
      return 0.2126 * lin(r) + 0.7152 * lin(g) + 0.0722 * lin(b);
    }

    function contrast(a, b) {
      var x = relLum(a), y = relLum(b);
      return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05);
    }

    /* 조각 글자색: 검정·흰색 중 대비가 더 높은 쪽. 고정 임계값보다 중간 밝기 색에서 훨씬 잘 읽힌다 */
    function textOn(hex) {
      return contrast(hex, "#171208") >= contrast(hex, "#FFFFFF") ? "#171208" : "#FFFFFF";
    }

    /* ── drawing ── */
    function sizeCanvas() {
      var box = canvas.parentNode.getBoundingClientRect();
      var side = Math.max(240, Math.min(box.width, box.height));
      var dpr = Math.min(window.devicePixelRatio || 1, 2.5);
      canvas.width = Math.round(side * dpr);
      canvas.height = Math.round(side * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      draw();
    }

    function draw() {
      if (mode === "ladder") { drawLadder(); return; }
      var side = canvas.width / Math.min(window.devicePixelRatio || 1, 2.5);
      var cx = side / 2;
      var cy = side / 2;
      var r = side / 2 - 6;
      var hubR = side * 0.145;

      ctx.clearRect(0, 0, side, side);

      var L = layout();
      var n = L.names.length;

      if (n === 0) {
        var msg = items.length ? S().canvasAllSkipped : S().canvasEmpty;
        ctx.save();
        ctx.strokeStyle = css["--line-strong"];
        ctx.setLineDash([7, 8]);
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(cx, cy, r - 2, 0, TAU);
        ctx.stroke();
        ctx.setLineDash([]);

        // 문구는 허브 버튼에 가리지 않도록 허브 아래에, 필요하면 두 줄로
        var maxW = side * 0.62;
        var fs = Math.round(side * 0.042);
        var lines = wrapText(msg, maxW, fs);
        while (fs > 11 && widest(lines, fs) > maxW) {
          fs -= 1;
          lines = wrapText(msg, maxW, fs);
        }

        ctx.fillStyle = css["--ink-3"];
        ctx.font = wheelFont(700, fs);
        ctx.textAlign = "center";
        ctx.textBaseline = "top";
        var lh = fs * 1.36;
        var top = cy + hubR + side * 0.055;
        for (var li = 0; li < lines.length; li++) {
          ctx.fillText(lines[li], cx, top + li * lh);
        }
        ctx.restore();
        return;
      }

      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(rot);

      for (var i = 0; i < n; i++) {
        var aw = L.angle(i);
        var a0 = -Math.PI / 2 + L.starts[i];
        var fill = colorFor(i, n);

        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, r, a0, a0 + aw);
        ctx.closePath();
        ctx.fillStyle = fill;
        ctx.fill();

        if (n <= 40) {
          ctx.strokeStyle = "rgba(0,0,0,.14)";
          ctx.lineWidth = 1;
          ctx.stroke();
        }

        // 조각 라벨
        var mid = a0 + aw / 2;
        var avail = r - 14 - hubR - 8;
        var byArc = aw * r * 0.5;
        var fs = Math.max(9, Math.min(side * 0.055, byArc, 30));

        ctx.save();
        ctx.rotate(mid);
        ctx.fillStyle = textOn(fill);
        ctx.font = wheelFont(800, fs.toFixed(1));
        ctx.textBaseline = "middle";

        var label = fit(L.names[i], avail);
        var abs = norm(mid + rot);
        var flipped = abs > Math.PI / 2 && abs < Math.PI * 1.5;

        if (flipped) {
          ctx.rotate(Math.PI);
          ctx.textAlign = "left";
          ctx.fillText(label, -(r - 14), 0);
        } else {
          ctx.textAlign = "right";
          ctx.fillText(label, r - 14, 0);
        }
        ctx.restore();
      }
      ctx.restore();

      // 림 + 안쪽 음영
      ctx.save();
      ctx.translate(cx, cy);
      var shade = ctx.createRadialGradient(0, 0, r * 0.3, 0, 0, r);
      shade.addColorStop(0, "rgba(0,0,0,0)");
      shade.addColorStop(1, "rgba(0,0,0,.16)");
      ctx.fillStyle = shade;
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, TAU);
      ctx.fill();

      ctx.strokeStyle = css["--surface"];
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.arc(0, 0, r + 1, 0, TAU);
      ctx.stroke();
      ctx.strokeStyle = css["--line-strong"];
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(0, 0, r - 1.5, 0, TAU);
      ctx.stroke();
      ctx.restore();
    }

    /* 띄어쓰기 기준 두 줄까지 접는다. 공백이 없는 언어는 한 줄 그대로 */
    function wrapText(text, maxW, fs) {
      ctx.font = wheelFont(700, fs);
      if (ctx.measureText(text).width <= maxW) return [text];

      var words = text.split(" ");
      if (words.length < 2) return [text];

      var best = null;
      for (var cut = 1; cut < words.length; cut++) {
        var a = words.slice(0, cut).join(" ");
        var b = words.slice(cut).join(" ");
        var worst = Math.max(ctx.measureText(a).width, ctx.measureText(b).width);
        if (!best || worst < best.worst) best = { lines: [a, b], worst: worst };
      }
      return best.lines;
    }

    function widest(lines, fs) {
      ctx.font = wheelFont(700, fs);
      var w = 0;
      for (var i = 0; i < lines.length; i++) w = Math.max(w, ctx.measureText(lines[i]).width);
      return w;
    }

    /* ── 사다리 그리기 ── */
    function ladderGeom(side) {
      var padX = side * 0.09;
      var top = side * 0.11;
      var bottom = side * 0.70;
      var n = Math.max(ladder.cols, 1);
      var gap = n > 1 ? (side - padX * 2) / (n - 1) : 0;
      return {
        x: function (c) { return n > 1 ? padX + c * gap : side / 2; },
        y: function (r) { return top + (bottom - top) * (r / ladder.rows); },
        top: top, bottom: bottom, gap: gap, padX: padX
      };
    }

    function drawLadder() {
      var side = canvas.width / Math.min(window.devicePixelRatio || 1, 2.5);
      ctx.clearRect(0, 0, side, side);

      var n = ladder.cols;
      if (n < 2) {
        var msg = items.length ? S().canvasAllSkipped : S().canvasEmpty;
        ctx.fillStyle = css["--ink-3"];
        ctx.font = wheelFont(700, Math.round(side * 0.042));
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(msg, side / 2, side / 2);
        return;
      }

      var g = ladderGeom(side);

      // 세로줄
      ctx.strokeStyle = css["--line-strong"];
      ctx.lineWidth = 2;
      for (var c = 0; c < n; c++) {
        ctx.beginPath();
        ctx.moveTo(g.x(c), g.top);
        ctx.lineTo(g.x(c), g.bottom);
        ctx.stroke();
      }

      // 가로선
      ctx.lineWidth = 3;
      for (var r = 0; r < ladder.rows; r++) {
        for (var c2 = 0; c2 < n - 1; c2++) {
          if (!hasRung(c2, r)) continue;
          ctx.strokeStyle = colorFor(c2, n);
          ctx.beginPath();
          ctx.moveTo(g.x(c2), g.y(r + 0.5));
          ctx.lineTo(g.x(c2 + 1), g.y(r + 0.5));
          ctx.stroke();
        }
      }

      // 출발점
      for (var c3 = 0; c3 < n; c3++) {
        var on = ladder.start === c3;
        ctx.beginPath();
        ctx.arc(g.x(c3), g.top - side * 0.035, side * 0.021, 0, TAU);
        ctx.fillStyle = on ? css["--ink"] : colorFor(c3, n);
        ctx.fill();
      }

      // 도착지 이름 — 가로로 쓴다. 후보가 많으면 위아래로 엇갈려 폭을 두 배로 쓴다
      var lfs = Math.max(10, Math.min(side * 0.031, 15));
      var stagger = n >= 5;
      var maxW = stagger ? g.gap * 1.8 : Math.max(g.gap * 0.92, side * 0.18);

      ctx.save();
      ctx.textAlign = "center";
      ctx.textBaseline = "top";
      for (var c4 = 0; c4 < n; c4++) {
        var hit = ladder.path && ladder.path.end === c4;
        ctx.font = wheelFont(hit ? 800 : 600, lfs.toFixed(1));
        ctx.fillStyle = hit ? colorFor(c4, n) : css["--ink-2"];

        var label = fit(ladder.names[c4], maxW);
        var half = ctx.measureText(label).width / 2;
        var lx = Math.min(Math.max(g.x(c4), half + 3), side - half - 3);
        var drop = stagger && (c4 % 2 === 1) ? lfs * 1.7 : 0;
        var ly = g.bottom + side * 0.045 + drop;

        // 줄에서 라벨까지 이어주는 짧은 안내선 (엇갈리거나 옆으로 밀렸을 때)
        if (drop || Math.abs(lx - g.x(c4)) > 1) {
          ctx.strokeStyle = css["--line"];
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(g.x(c4), g.bottom);
          ctx.lineTo(g.x(c4), ly - 3);
          ctx.stroke();
        }

        ctx.fillText(label, lx, ly);
      }
      ctx.restore();

      // 지나온 경로
      if (ladder.path) {
        var pts = ladder.path.pts;
        var segs = [];
        for (var i = 0; i < pts.length - 1; i++) {
          var a = pts[i], b = pts[i + 1];
          var ax = g.x(a.c), ay = i === 0 ? g.top : g.y(a.r + 0.5);
          var bx = g.x(b.c), by = i === pts.length - 2 ? g.bottom : g.y(b.r + 0.5);
          if (a.c !== b.c) { segs.push([ax, ay, ax, by]); segs.push([ax, by, bx, by]); }
          else segs.push([ax, ay, bx, by]);
        }
        var total = segs.reduce(function (t, s2) { return t + Math.hypot(s2[2] - s2[0], s2[3] - s2[1]); }, 0);
        var drawLen = total * ladder.progress;

        ctx.strokeStyle = colorFor(ladder.start, n);
        ctx.lineWidth = 4;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.beginPath();
        for (var j = 0; j < segs.length && drawLen > 0; j++) {
          var s3 = segs[j];
          var len = Math.hypot(s3[2] - s3[0], s3[3] - s3[1]);
          var k = Math.min(1, drawLen / (len || 1));
          ctx.moveTo(s3[0], s3[1]);
          ctx.lineTo(s3[0] + (s3[2] - s3[0]) * k, s3[1] + (s3[3] - s3[1]) * k);
          drawLen -= len;
        }
        ctx.stroke();
        ctx.lineCap = "butt";
      }
    }

    function fit(text, width) {
      if (ctx.measureText(text).width <= width) return text;
      var cut = text;
      while (cut.length > 1 && ctx.measureText(cut + "…").width > width) cut = cut.slice(0, -1);
      return cut + "…";
    }

    function norm(a) { return ((a % TAU) + TAU) % TAU; }

    /* ── sound ── */
    var audio = null;
    function tick() {
      if (!soundOn) return;
      try {
        if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
        var t = audio.currentTime;
        var osc = audio.createOscillator();
        var gain = audio.createGain();
        osc.type = "triangle";
        osc.frequency.setValueAtTime(1180, t);
        gain.gain.setValueAtTime(0.05, t);
        gain.gain.exponentialRampToValueAtTime(0.0006, t + 0.045);
        osc.connect(gain).connect(audio.destination);
        osc.start(t);
        osc.stop(t + 0.05);
      } catch (e) { soundOn = false; }
    }

    function chime() {
      if (!soundOn) return;
      try {
        if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
        [0, 0.09, 0.19].forEach(function (d, k) {
          var t = audio.currentTime + d;
          var osc = audio.createOscillator();
          var gain = audio.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime([660, 880, 1174][k], t);
          gain.gain.setValueAtTime(0.09, t);
          gain.gain.exponentialRampToValueAtTime(0.0008, t + 0.3);
          osc.connect(gain).connect(audio.destination);
          osc.start(t);
          osc.stop(t + 0.32);
        });
      } catch (e) { /* 소리는 없어도 게임은 돌아간다 */ }
    }

    /* ── spin ── */
    function randInt(max) {
      if (window.crypto && window.crypto.getRandomValues) {
        var limit = Math.floor(4294967296 / max) * max;
        var a = new Uint32Array(1);
        do { window.crypto.getRandomValues(a); } while (a[0] >= limit);
        return a[0] % max;
      }
      return Math.floor(Math.random() * max);
    }

    function randFloat() {
      if (window.crypto && window.crypto.getRandomValues) {
        var a = new Uint32Array(1);
        window.crypto.getRandomValues(a);
        return a[0] / 4294967296;
      }
      return Math.random();
    }

    function pickWeighted(L) {
      var x = randFloat() * L.total;
      for (var i = 0; i < L.w.length; i++) {
        x -= L.w[i];
        if (x < 0) return i;
      }
      return L.w.length - 1;
    }

    function spin() {
      if (spinning) return;
      var live = activeItems();
      if (live.length < 2) {
        setHint(items.length >= 2 ? "hintAllSkipped" : "hintNeedTwo", true);
        input.focus();
        return;
      }

      spinning = true;
      setBusy(true);
      setHint("spinning", false);

      var L = layout();
      var winner = pickWeighted(L);
      var aw = L.angle(winner);
      var center = L.starts[winner] + aw / 2;
      var jitter = (Math.random() - 0.5) * aw * 0.72;
      var target = norm(-center - jitter);
      var delta = norm(target - norm(rot));
      var turns = 5 + randInt(3);
      var from = rot;
      var to = from + turns * TAU + delta;

      var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      var dur = reduced ? 420 : 4200 + Math.random() * 700;
      var start = performance.now();
      var lastTickSlot = wedgeAt(from, L);
      var lastTickAt = 0;

      function frame(now) {
        var p = Math.min(1, (now - start) / dur);
        var eased = 1 - Math.pow(1 - p, 4);
        rot = from + (to - from) * eased;

        var slot = wedgeAt(rot, L);
        if (slot !== lastTickSlot) {
          lastTickSlot = slot;
          if (now - lastTickAt > 28) { tick(); lastTickAt = now; }
        }

        draw();
        if (p < 1) {
          requestAnimationFrame(frame);
        } else {
          rot = norm(to);
          draw();
          spinning = false;
          setBusy(false);
          finish(winner, L.names);
        }
      }
      requestAnimationFrame(frame);
    }

    function applyMode() {
      var isLadder = mode === "ladder";
      needle.hidden = isLadder;
      hub.hidden = isLadder;
      reshuffleBtn.hidden = !isLadder;
      canvas.style.cursor = isLadder ? "pointer" : "default";
      Array.prototype.forEach.call(modeSwitch.children, function (b) {
        b.setAttribute("aria-pressed", String(b.getAttribute("data-mode") === mode));
      });
      if (isLadder) {
        buildLadder();
        setHint("ladderTip", false);
      } else {
        setHint(activeItems().length < 2 ? "hintStart" : "hintReady", false);
      }
      setBusy(spinning);
      draw();
    }

    function setBusy(on) {
      spinBtn.disabled = on;
      hub.disabled = on;
      hub.textContent = on ? "…" : S().hub;
      if (mode === "ladder") spinBtn.textContent = on ? S().ladderRunning : S().ladderGo;
      else spinBtn.textContent = on ? S().spinning : S().spin;
    }

    function setHint(key, warn) {
      hintKey = key;
      hintWarn = !!warn;
      hint.textContent = key === "spinning" ? S().spinning : S()[key];
      hint.classList.toggle("warn", hintWarn);
    }

    /* 큰 판의 현재 그림을 카드 안 작은 판으로 옮겨 담는다 */
    function copyToShot() {
      var dpr = Math.min(window.devicePixelRatio || 1, 2.5);
      var box = shotCanvas.getBoundingClientRect();
      var side = Math.max(160, box.width || 240);
      shotCanvas.width = Math.round(side * dpr);
      shotCanvas.height = Math.round(side * dpr);
      var sctx = shotCanvas.getContext("2d");
      sctx.setTransform(1, 0, 0, 1, 0, 0);
      sctx.clearRect(0, 0, shotCanvas.width, shotCanvas.height);
      sctx.drawImage(canvas, 0, 0, shotCanvas.width, shotCanvas.height);
    }

    /* 공유받은 결과를 원래 판 모습으로 되살린다 */
    function rebuildScene(name, how, seed, startCol) {
      var savedWeighted = weighted, savedSkipped = skipped, savedMode = mode;
      weighted = false;                      // 보낸 사람의 기록은 알 수 없으므로 균등하게 그린다
      skipped = [];

      if (seed !== null) {
        mode = "ladder";
        buildLadder(seed);
        if (ladder.cols >= 2) {
          var col = Math.min(Math.max(startCol, 0), ladder.cols - 1);
          ladder.start = col;
          ladder.path = tracePath(col);
          ladder.progress = 1;
        }
        drawLadder();
      } else {
        mode = "wheel";
        var L = layout();
        var at = L.names.indexOf(name);
        if (at !== -1) rot = norm(-(L.starts[at] + L.angle(at) / 2));
        draw();
      }

      copyToShot();
      weighted = savedWeighted;
      skipped = savedSkipped;
      mode = savedMode;
    }

    function showResult(name, color, count, how, shared) {
      resultName.textContent = name;
      resultName.style.setProperty("--win", color);
      resultMeta.textContent = S().pickedFrom(count, how);
      resultEyebrow.textContent = shared ? S().sharedEyebrow : S().resultEyebrow;

      // 남의 결과를 열었을 때는 '나도 돌려보기'만, 내 결과일 때는 평소 버튼들
      document.getElementById("try-mine").hidden = !shared;
      document.getElementById("again").hidden = shared;
      document.getElementById("exclude").hidden = shared;
      document.getElementById("share-result").hidden = shared;
      lastResult = shared ? null : {
        name: name, count: count, how: how,
        seed: mode === "ladder" ? ladder.seed : null,
        start: mode === "ladder" ? ladder.start : null
      };
      shownResult = { name: name, color: color, count: count, how: how, shared: shared };
      overlay.hidden = false;
    }

    function finish(winner, live) {
      var name = live[winner];
      copyToShot();
      showResult(name, colorFor(winner, live.length), live.length,
                 S()[mode === "ladder" ? "modeLadder" : "modeWheel"], false);
      document.getElementById("again").focus();
      live.textContent = S().result(name);
      setHint("hintAgain", false);
      chime();

      history.unshift(name);
      // 확률에 영향을 주는 만큼만 남긴다 — 보이는 것과 작동하는 것을 일치시킨다
      if (history.length > DECAY.length) history.length = DECAY.length;

      // 새 가중치로 조각 폭이 달라지므로, 당첨 조각이 계속 바늘 아래 오도록 맞춘다
      var after = layout();
      var at = after.names.indexOf(name);
      if (at !== -1) rot = norm(-(after.starts[at] + after.angle(at) / 2));

      renderHistory();
      render();
      save();
    }

    /* ── list ── */
    function addNames(raw) {
      var parts = String(raw).split(/[,\n\t]+/);
      var added = 0;
      var dupIndex = -1;

      parts.forEach(function (p) {
        var name = p.trim().replace(/\s+/g, " ").slice(0, MAX_NAME);
        if (!name) return;
        var at = items.indexOf(name);
        if (at !== -1) { dupIndex = at; return; }
        items.push(name);
        added++;
      });

      if (added) setHint(activeItems().length < 2 ? "hintStart" : "hintReady", false);
      render();
      if (dupIndex !== -1) flashDup(dupIndex);
      return added;
    }

    function flashDup(index) {
      var chip = listEl.children[index];
      if (!chip) return;
      chip.classList.add("dup");
      setHint("hintDup", false);
      setTimeout(function () { chip.classList.remove("dup"); }, 360);
    }

    function remove(index) {
      items.splice(index, 1);
      render();
      save();
    }

    function render() {
      listEl.textContent = "";
      var n = items.length;
      var L = layout();
      var live = L.names.length;
      // 가중치가 실제로 갈릴 때만 확률을 적는다
      var showOdds = weighted && L.w.some(function (x) { return x !== L.w[0]; });

      trayList.textContent = "";

      items.forEach(function (name, i) {
        if (isSkipped(name)) {
          // 오늘 쉬는 곳은 목록에서 내려와 아래 칸에 머문다
          var back = document.createElement("li");
          back.className = "tray-item";

          var label = document.createElement("span");
          label.className = "tray-name";
          label.textContent = name;

          var undo = document.createElement("button");
          undo.className = "tray-back";
          undo.type = "button";
          undo.textContent = "↩";
          undo.title = S().unskip;
          undo.setAttribute("aria-label", name + " — " + S().unskip);
          undo.addEventListener("click", function () { toggleSkip(name); });

          back.appendChild(label);
          back.appendChild(undo);
          trayList.appendChild(back);
          return;
        }

        var pos = L.names.indexOf(name);           // 원판에서의 자리 = 칩 색

        var li = document.createElement("li");
        li.className = "chip";
        li.style.setProperty("--chip", colorFor(pos, live));

        var span = document.createElement("button");
        span.className = "chip-name";
        span.type = "button";
        span.textContent = name;
        span.title = S().skipToday;
        span.setAttribute("aria-label", name + " — " + S().skipToday);
        span.addEventListener("click", function () { toggleSkip(name); });

        var x = document.createElement("button");
        x.className = "chip-x";
        x.type = "button";
        x.textContent = "×";
        x.setAttribute("aria-label", S().remove(name));
        x.addEventListener("click", function () { remove(i); });

        li.appendChild(span);

        if (showOdds) {
          var odds = document.createElement("span");
          odds.className = "chip-odds";
          odds.textContent = Math.round(L.w[pos] / L.total * 100) + "%";
          li.appendChild(odds);
        }

        li.appendChild(x);
        listEl.appendChild(li);
      });

      skipTray.hidden = live === n;

      if (mode === "ladder" && ladder.names.join("|") !== L.names.join("|")) buildLadder();

      emptyEl.hidden = n > 0;
      countEl.textContent = S().count(live) + (n - live ? " · " + S().excluded(n - live) : "");
      shareOut.hidden = true;
      draw();
      save();
    }

    var pendingDelete = -1;

    function renderTabs() {
      tabsEl.textContent = "";

      groups.forEach(function (g, i) {
        var tab = document.createElement("button");
        tab.type = "button";
        tab.className = "tab" + (pendingDelete === i ? " confirm" : "");
        tab.setAttribute("role", "tab");
        tab.setAttribute("aria-selected", String(i === active));

        var label = document.createElement("span");
        label.textContent = pendingDelete === i ? S().groupConfirm : g.name;
        tab.appendChild(label);

        tab.addEventListener("click", function () {
          if (pendingDelete === i) { pendingDelete = -1; removeGroup(i); return; }
          pendingDelete = -1;
          if (i === active) startRename(i, tab, label);   // 이미 열린 탭을 누르면 이름 바꾸기
          else switchGroup(i);
        });

        if (i === active && groups.length > 1) {
          var x = document.createElement("button");
          x.type = "button";
          x.className = "tab-x";
          x.textContent = "×";
          x.title = S().groupDelete;
          x.setAttribute("aria-label", g.name + " — " + S().groupDelete);
          x.addEventListener("click", function (e) {
            e.stopPropagation();
            if (!items.length) { removeGroup(i); return; }   // 비어 있으면 바로
            pendingDelete = pendingDelete === i ? -1 : i;     // 내용이 있으면 한 번 더 확인
            renderTabs();
          });
          tab.appendChild(x);
        }

        tabsEl.appendChild(tab);
      });

      var add = document.createElement("button");
      add.type = "button";
      add.className = "tab-add";
      add.textContent = "+";
      add.title = S().groupAdd;
      add.setAttribute("aria-label", S().groupAdd);
      add.addEventListener("click", function () {
        pendingDelete = -1;
        addGroup(S().groupNew);
        var last = tabsEl.children[groups.length - 1];
        if (last) startRename(active, last, last.firstChild);
      });
      tabsEl.appendChild(add);
    }

    function startRename(i, tab, label) {
      var input = document.createElement("input");
      input.type = "text";
      input.className = "tab-input";
      input.value = groups[i].name;
      input.maxLength = 14;

      function done(save2) {
        if (save2) renameGroup(i, input.value);
        else renderTabs();
      }
      input.addEventListener("keydown", function (e) {
        if (e.key === "Enter") { e.preventDefault(); done(true); }
        if (e.key === "Escape") { e.preventDefault(); done(false); }
      });
      input.addEventListener("blur", function () { done(true); });

      tab.replaceWith(input);
      input.focus();
      input.select();
    }

    function renderHistory() {
      chipsEl.textContent = "";
      // 지우기는 늘 자리를 지키되, 지울 기록이 없으면 비활성
      clearHistBtn.disabled = !history.length;
      emptyHistEl.hidden = history.length > 0;

      history.forEach(function (name) {
        var el = document.createElement("span");
        el.className = "history-item";
        el.textContent = name;
        el.title = name;                 // 잘린 이름은 마우스를 올리면 전체가 보인다
        chipsEl.appendChild(el);
      });
    }

    /* ── language ── */
    function applyLang() {
      var s = S();
      document.documentElement.lang = lang;
      document.documentElement.setAttribute("data-lang", lang);
      document.title = s.title;

      Array.prototype.forEach.call(document.querySelectorAll("[data-i18n]"), function (el) {
        el.textContent = s[el.getAttribute("data-i18n")];
      });
      Array.prototype.forEach.call(document.querySelectorAll("[data-i18n-ph]"), function (el) {
        el.placeholder = s[el.getAttribute("data-i18n-ph")];
      });
      Array.prototype.forEach.call(document.querySelectorAll("[data-i18n-aria]"), function (el) {
        el.setAttribute("aria-label", s[el.getAttribute("data-i18n-aria")]);
      });
      Array.prototype.forEach.call(document.querySelectorAll("[data-i18n-tip]"), function (el) {
        el.setAttribute("data-tip", s[el.getAttribute("data-i18n-tip")]);
      });

      var current = LANGS.filter(function (l) { return l.code === lang; })[0] || LANGS[1];
      langCode.textContent = current.short;
      Array.prototype.forEach.call(themeMenu.querySelectorAll("[data-theme-name]"), function (el) {
        var id = el.getAttribute("data-theme-name");
        el.textContent = (s.themes && s.themes[id]) || id;
      });
      Array.prototype.forEach.call(langMenu.children, function (item) {
        item.setAttribute("aria-checked", String(item.getAttribute("data-lang") === lang));
      });

      renderTabs();
      setBusy(spinning);
      setHint(hintKey, hintWarn);
      if (shownResult && !overlay.hidden) {
        var how = shownResult.how;
        resultMeta.textContent = s.pickedFrom(shownResult.count, how);
        resultEyebrow.textContent = shownResult.shared ? s.sharedEyebrow : s.resultEyebrow;
      }
      updateToggles();
      readTheme();
      render();
      renderHistory();
    }

    function updateToggles() {
      weightBtn.checked = weighted;
    }

    function setLang(code) {
      if (!STRINGS[code] || code === lang) return;
      lang = code;
      save();
      applyLang();
    }

    function pickLang() {
      var stored = null;
      try { stored = (JSON.parse(localStorage.getItem(STORE_KEY) || "{}")).lang; } catch (e) { /* 무시 */ }
      if (stored && STRINGS[stored]) return stored;

      var fromHash = /[#&]lang=([a-z]{2})/i.exec(location.hash || "");
      if (fromHash && STRINGS[fromHash[1].toLowerCase()]) return fromHash[1].toLowerCase();

      var list = navigator.languages || [navigator.language || "en"];
      for (var i = 0; i < list.length; i++) {
        var code = String(list[i]).slice(0, 2).toLowerCase();
        if (STRINGS[code]) return code;
      }
      return "en";
    }

    /* ─── 색상 테마 ─── */
    function themeById(id) {
      return THEMES.filter(function (t) { return t.id === id; })[0] || THEMES[0];
    }

    function applyTheme() {
      var t = themeById(theme);
      var root = document.documentElement;

      TOKEN_KEYS.forEach(function (k) { root.style.removeProperty("--" + k); });
      if (t.tokens) {
        Object.keys(t.tokens).forEach(function (k) { root.style.setProperty("--" + k, t.tokens[k]); });
      }
      root.setAttribute("data-palette", t.id);

      PALETTE = t.wedges || DEFAULT_WEDGES;
      readTheme();                      // 캔버스가 쓰는 색·폰트 값을 다시 읽는다
      render();                         // 조각과 칩 색 갱신
      updateThemeMenu();
    }

    function updateThemeMenu() {
      Array.prototype.forEach.call(themeMenu.children, function (card) {
        card.setAttribute("aria-checked", String(card.getAttribute("data-theme-id") === theme));
      });
    }

    function buildThemeMenu() {
      themeMenu.textContent = "";
      THEMES.forEach(function (t) {
        var wedges = t.wedges || DEFAULT_WEDGES;
        var ground = t.tokens ? t.tokens.ground : t.preview.ground;
        var accent = t.tokens ? t.tokens.accent : t.preview.accent;

        var card = document.createElement("button");
        card.type = "button";
        card.className = "theme-card";
        card.setAttribute("role", "menuitemradio");
        card.setAttribute("data-theme-id", t.id);
        card.setAttribute("aria-checked", "false");

        var swatch = document.createElement("span");
        swatch.className = "theme-swatch";
        swatch.style.background = ground;
        [wedges[0], wedges[3], wedges[5], accent].forEach(function (c) {
          var dot = document.createElement("i");
          dot.style.background = c;
          swatch.appendChild(dot);
        });

        var name = document.createElement("span");
        name.className = "theme-name";
        name.setAttribute("data-theme-name", t.id);

        card.appendChild(swatch);
        card.appendChild(name);
        card.addEventListener("click", function () {
          setTheme(t.id);
          closeThemeMenu(true);
        });
        themeMenu.appendChild(card);
      });
    }

    function setTheme(id) {
      if (id === theme) return;
      theme = id;
      applyTheme();
      save();
    }

    function openThemeMenu() {
      closeMenu(false);
      themeMenu.hidden = false;
      themeBtn.setAttribute("aria-expanded", "true");
      var checked = themeMenu.querySelector('[aria-checked="true"]');
      (checked || themeMenu.firstChild).focus();
    }

    function closeThemeMenu(refocus) {
      if (themeMenu.hidden) return;
      themeMenu.hidden = true;
      themeBtn.setAttribute("aria-expanded", "false");
      if (refocus) themeBtn.focus();
    }

    themeBtn.addEventListener("click", function () {
      if (themeMenu.hidden) openThemeMenu(); else closeThemeMenu(true);
    });

    document.addEventListener("click", function (e) {
      if (!themeMenu.hidden && !document.getElementById("theme-pick").contains(e.target)) closeThemeMenu(false);
    });

    function buildMenu() {
      LANGS.forEach(function (l) {
        var item = document.createElement("button");
        item.type = "button";
        item.className = "lang-item";
        item.setAttribute("role", "menuitemradio");
        item.setAttribute("data-lang", l.code);
        item.setAttribute("aria-checked", "false");
        item.lang = l.code;

        var name = document.createElement("span");
        name.textContent = l.name;
        var tick = document.createElement("span");
        tick.className = "tick";
        tick.textContent = "✓";

        item.appendChild(name);
        item.appendChild(tick);
        item.addEventListener("click", function () {
          setLang(l.code);
          closeMenu(true);
        });
        langMenu.appendChild(item);
      });
    }

    function openMenu() {
      closeThemeMenu(false);
      langMenu.hidden = false;
      langBtn.setAttribute("aria-expanded", "true");
      var checked = langMenu.querySelector('[aria-checked="true"]');
      (checked || langMenu.firstChild).focus();
    }

    function closeMenu(refocus) {
      if (langMenu.hidden) return;
      langMenu.hidden = true;
      langBtn.setAttribute("aria-expanded", "false");
      if (refocus) langBtn.focus();
    }

    langBtn.addEventListener("click", function () {
      if (langMenu.hidden) openMenu(); else closeMenu(true);
    });

    langMenu.addEventListener("keydown", function (e) {
      var opts = Array.prototype.slice.call(langMenu.children);
      var at = opts.indexOf(document.activeElement);
      if (e.key === "ArrowDown" || e.key === "ArrowUp") {
        e.preventDefault();
        var next = (at + (e.key === "ArrowDown" ? 1 : opts.length - 1) + opts.length) % opts.length;
        opts[next].focus();
      }
    });

    document.addEventListener("click", function (e) {
      if (!langMenu.hidden && !document.getElementById("lang").contains(e.target)) closeMenu(false);
    });

    /* ── storage & sharing ── */
    function save() {
      commitGroup();
      try {
        localStorage.setItem(STORE_KEY, JSON.stringify({
          v: 2, groups: groups, active: active,
          lang: lang, theme: theme, weighted: weighted, mode: mode
        }));
      } catch (e) { /* 저장이 막혀 있어도 그냥 쓴다 */ }
    }

    function load() {
      lang = pickLang();

      var saved = {};
      try { saved = JSON.parse(localStorage.getItem(STORE_KEY) || "{}"); } catch (e) { saved = {}; }

      if (saved.lang && STRINGS[saved.lang]) lang = saved.lang;
      if (saved.theme) theme = saved.theme;
      if (typeof saved.weighted === "boolean") weighted = saved.weighted;
      if (saved.mode === "ladder" || saved.mode === "wheel") mode = saved.mode;

      if (Array.isArray(saved.groups) && saved.groups.length) {
        groups = saved.groups.filter(function (g) { return g && typeof g === "object"; });
      } else if (Array.isArray(saved.items)) {
        // 카테고리가 없던 시절에 저장된 내용을 첫 카테고리로 옮긴다
        groups = [{
          name: S().groupDefault,
          items: saved.items.filter(function (t) { return typeof t === "string" && t; }),
          skipped: Array.isArray(saved.skipped) ? saved.skipped : [],
          skipDate: saved.skipDate || "",
          history: Array.isArray(saved.history) ? saved.history : []
        }];
      }
      if (!groups.length) groups = [{ name: S().groupDefault, items: [], skipped: [], skipDate: "", history: [] }];

      loadGroup(Math.min(Math.max(saved.active || 0, 0), groups.length - 1));

      // 공유받은 목록은 내 카테고리를 덮지 않고 따로 담는다
      var fromHash = readHash();
      if (fromHash) {
        var shared = S().groupShared;
        var at = -1;
        groups.forEach(function (g, i) { if (g.name === shared) at = i; });
        if (at === -1) {
          groups.push({ name: shared, items: fromHash, skipped: [], skipDate: "", history: [] });
          at = groups.length - 1;
        } else {
          groups[at].items = fromHash;
        }
        loadGroup(at);
      }
    }

    function readHash() {
      var m = /[#&]r=([^&]*)/.exec(location.hash || "");
      if (!m) return null;
      try {
        var names = decodeURIComponent(m[1]).split("|")
          .map(function (s) { return s.trim().slice(0, MAX_NAME); })
          .filter(function (s) { return !!s; });
        var out = [];
        names.forEach(function (s) { if (out.indexOf(s) === -1) out.push(s); });
        return out.length ? out : null;
      } catch (e) { return null; }
    }

    function shareLink() {
      // 언어는 붙이지 않는다 — 받는 사람의 브라우저 언어로 열리는 편이 낫다
      var base = location.href.split("#")[0];
      return base + "#r=" + encodeURIComponent(items.join("|"));
    }

    /* ── events ── */
    document.getElementById("add-form").addEventListener("submit", function (e) {
      e.preventDefault();
      if (addNames(input.value)) input.value = "";
      input.focus();
    });

    /* 사다리를 따라 내려가는 애니메이션 */
    function runLadder(start) {
      if (spinning || ladder.cols < 2) return;
      spinning = true;
      setBusy(true);
      setHint("ladderRunning", false);

      ladder.start = start;
      ladder.path = tracePath(start);
      ladder.progress = 0;

      var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      var dur = reduced ? 300 : 1500;
      var t0 = performance.now();
      var lastTick = 0;

      function frame(now) {
        var p = Math.min(1, (now - t0) / dur);
        ladder.progress = p;
        if (now - lastTick > 90) { tick(); lastTick = now; }
        drawLadder();
        if (p < 1) requestAnimationFrame(frame);
        else {
          spinning = false;
          setBusy(false);
          finish(ladder.path.end, ladder.names);
        }
      }
      requestAnimationFrame(frame);
    }

    function startAny() {
      if (mode !== "ladder") { spin(); return; }
      var n = ladder.cols;
      if (n < 2) { setHint(items.length >= 2 ? "hintAllSkipped" : "hintNeedTwo", true); return; }
      runLadder(randInt(n));
    }

    canvas.addEventListener("click", function (e) {
      if (mode !== "ladder" || spinning || ladder.cols < 2) return;
      var box = canvas.getBoundingClientRect();
      var side = box.width;
      var x = (e.clientX - box.left) / box.width * side;
      var y = (e.clientY - box.top) / box.height * side;
      var g = ladderGeom(side);

      // 위쪽 = 출발
      if (y < g.top + side * 0.02) {
        var col = Math.round((x - g.padX) / (g.gap || 1));
        if (col >= 0 && col < ladder.cols && Math.abs(x - g.x(col)) < g.gap * 0.45) runLadder(col);
        return;
      }
      // 사다리 안쪽 = 가로선 넣기/빼기
      if (y > g.top && y < g.bottom) {
        var c = Math.floor((x - g.padX) / (g.gap || 1));
        var r = Math.floor((y - g.top) / ((g.bottom - g.top) / ladder.rows));
        if (c >= 0 && c < ladder.cols - 1 && r >= 0 && r < ladder.rows) toggleRung(c, r);
      }
    });

    Array.prototype.forEach.call(modeSwitch.children, function (btn) {
      btn.addEventListener("click", function () {
        var next = btn.getAttribute("data-mode");
        if (next === mode || spinning) return;
        mode = next;
        applyMode();
        save();
      });
    });

    reshuffleBtn.addEventListener("click", function () {
      if (spinning) return;
      buildLadder();
      setHint("ladderTip", false);
      draw();
    });

    spinBtn.addEventListener("click", startAny);
    hub.addEventListener("click", spin);

    document.getElementById("clear").addEventListener("click", function () {
      if (!items.length) return;
      items = [];
      render();
      setHint("hintStart", false);
    });

    clearHistBtn.addEventListener("click", function () {
      if (!history.length) return;
      history = [];
      renderHistory();
      render();                                   // 가중치가 사라지므로 조각과 확률 표시를 다시 그린다
      setHint("hintHistoryCleared", false);
      save();
    });

    infoBtn.addEventListener("click", function () {
      var open = historyNote.hidden;
      historyNote.hidden = !open;
      infoBtn.setAttribute("aria-expanded", String(open));
    });

    weightBtn.addEventListener("change", function () {
      weighted = weightBtn.checked;
      updateToggles();
      setHint(weighted ? "hintWeightOn" : "hintWeightOff", false);
      render();
      save();
    });

    function flashTip(text) {
      shareBtn.setAttribute("data-tip", text);
      setTimeout(function () { shareBtn.setAttribute("data-tip", S().share); }, 1800);
    }

    shareBtn.addEventListener("click", function () {
      if (!items.length) {
        setHint("hintNoShare", true);
        return;
      }
      var url = shareLink();

      function showInput() {
        shareOut.hidden = false;
        shareOut.value = url;
        shareOut.select();
        flashTip(S().shareManual);
      }

      function copy() {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(url).then(function () { flashTip(S().shareDone); }, showInput);
        } else {
          showInput();
        }
      }

      // 기기의 공유 시트를 연다 — 카카오톡·메시지 등 설치된 앱이 그대로 뜬다
      if (navigator.share) {
        navigator.share({ title: S().title, text: S().title, url: url })["catch"](function (err) {
          // 사용자가 시트를 닫은 경우는 조용히 넘어가고, 지원되지 않을 때만 복사로 대체
          if (err && err.name === "AbortError") return;
          copy();
        });
      } else {
        copy();
      }
    });

    function resultLink(r) {
      var base = location.href.split("#")[0];
      var url = base + "#w=" + encodeURIComponent(r.name) +
                "&r=" + encodeURIComponent(items.join("|")) +
                "&m=" + (mode === "ladder" ? "l" : "w");
      // 사다리는 씨앗과 출발 줄이 있어야 받는 쪽에서 같은 그림이 나온다
      if (r.seed !== null && r.seed !== undefined) url += "&s=" + r.seed + "&c=" + r.start;
      return url;
    }

    document.getElementById("share-result").addEventListener("click", function () {
      if (!lastResult) return;
      var url = resultLink(lastResult);
      var text = S().resultText(lastResult.name);

      if (navigator.share) {
        navigator.share({ title: S().title, text: text, url: url })["catch"](function (err) {
          if (!err || err.name !== "AbortError") copyText(url, text);
        });
      } else {
        copyText(url, text);
      }
    });

    function copyText(url, text) {
      var payload = text + " " + url;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(payload).then(function () {
          setHint("shareDone", false);
        }, function () { showShareField(url); });
      } else {
        showShareField(url);
      }
    }

    function showShareField(url) {
      shareOut.hidden = false;
      shareOut.value = url;
      shareOut.select();
    }

    document.getElementById("try-mine").addEventListener("click", function () {
      closeResult();
      startAny();
    });

    function closeResult() {
      overlay.hidden = true;
      spinBtn.focus();
    }

    document.getElementById("close").addEventListener("click", closeResult);
    document.getElementById("again").addEventListener("click", function () {
      closeResult();
      if (mode === "ladder") { buildLadder(); draw(); }
      startAny();
    });

    document.getElementById("exclude").addEventListener("click", function () {
      var at = items.indexOf(resultName.textContent);
      if (at !== -1) remove(at);
      closeResult();
      if (activeItems().length >= 2) spin();
      else setHint("hintFew", true);
    });

    overlay.addEventListener("click", function (e) {
      if (e.target === overlay) closeResult();
    });

    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && !themeMenu.hidden) closeThemeMenu(true);
      else if (e.key === "Escape" && !langMenu.hidden) closeMenu(true);
      else if (e.key === "Escape" && !overlay.hidden) closeResult();
      if (e.key === " " && e.target === document.body) { e.preventDefault(); startAny(); }
    });

    window.addEventListener("resize", sizeCanvas);
    window.addEventListener("hashchange", function () {
      var next = readHash();
      if (next) { items = next; render(); }
    });

    var dark = window.matchMedia("(prefers-color-scheme: dark)");
    if (dark.addEventListener) dark.addEventListener("change", function () { readTheme(); draw(); });

    /* ── boot ── */
    readTheme();
    load();
    buildMenu();
    buildThemeMenu();
    renderTabs();
    applyTheme();
    hintKey = activeItems().length >= 2 ? "hintReady" : "hintStart";
    applyLang();
    applyMode();
    sizeCanvas();

    // 공유받은 결과가 주소에 있으면 카드부터 띄운다
    (function () {
      var m = /[#&]w=([^&]*)/.exec(location.hash || "");
      if (!m) return;
      try {
        var name = decodeURIComponent(m[1]).slice(0, MAX_NAME);
        if (!name) return;
        var at = items.indexOf(name);
        var isLadder = /[#&]m=l/.test(location.hash);
        var how = isLadder ? S().modeLadder : S().modeWheel;
        var sm = /[#&]s=(\d+)/.exec(location.hash);
        var cm = /[#&]c=(\d+)/.exec(location.hash);

        rebuildScene(name, how, isLadder && sm ? parseInt(sm[1], 10) : null,
                     cm ? parseInt(cm[1], 10) : 0);

        showResult(name, at === -1 ? "var(--accent-soft)" : colorFor(at, items.length),
                   items.length || 1, how, true);
      } catch (e) { /* 주소가 깨졌으면 그냥 평소 화면 */ }
    })();
  })();
</script>
</body>
</html>
