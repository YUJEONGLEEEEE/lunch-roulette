<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="description" content="점심 먹을 식당을 랜덤으로 골라주는 돌림판." />
<meta name="color-scheme" content="light dark" />
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#FFFFFF" />
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="오늘 뭐 먹지?" />
<link rel="apple-touch-icon" href="assets/icon-180.png" />
<link rel="icon" href="assets/icon-192.png" />
<link rel="manifest" href="assets/manifest.webmanifest" />
<title>오늘 뭐 먹지?</title>
<style>
  /* ─── iOS system tokens · light ─── */
  :root {
    --ground: #FFFFFF;
    --ground-2: #F2F2F7;
    --surface: #FFFFFF;
    --surface-2: rgba(120, 120, 128, .12);
    --glass: rgba(255, 255, 255, .66);
    --glass-line: rgba(255, 255, 255, .7);
    --ink: #000000;
    --ink-2: rgba(60, 60, 67, .74);
    --ink-3: rgba(60, 60, 67, .64);
    --line: rgba(60, 60, 67, .16);
    --line-strong: rgba(60, 60, 67, .28);
    --accent: #007AFF;
    --accent-soft: rgba(0, 122, 255, .12);
    --accent-ink: #FFFFFF;
    --deep: #34C759;
    --on-deep: #FFFFFF;
    --metal-a: rgba(255, 255, 255, .92);
    --metal-b: rgba(245, 245, 247, .72);
    --blob-a: rgba(0, 122, 255, .40);
    --blob-b: rgba(255, 45, 85, .30);
    --blob-c: rgba(88, 86, 214, .34);
    --g-top: .72;
    --g-mid: .56;
    --g-bot: .64;
    --g-edge: rgba(255, 255, 255, .8);
    --g-sheen: rgba(255, 255, 255, .9);
    --shadow: 0 .5px 1px rgba(0, 0, 0, .04), 0 8px 24px -10px rgba(0, 0, 0, .16);
    --shadow-lift: 0 1px 2px rgba(0, 0, 0, .06), 0 24px 56px -20px rgba(0, 0, 0, .28);

    --display: -apple-system, "SF Pro Display", "Apple SD Gothic Neo", "Pretendard", system-ui, sans-serif;
    --body: -apple-system, "SF Pro Text", "Apple SD Gothic Neo", "Pretendard", system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }

  /* ─── iOS system tokens · dark via OS ─── */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #000000;
      --ground-2: #1C1C1E;
      --surface: #1C1C1E;
      --surface-2: rgba(120, 120, 128, .24);
      --glass: rgba(28, 28, 30, .68);
      --glass-line: rgba(255, 255, 255, .1);
      --ink: #FFFFFF;
      --ink-2: rgba(235, 235, 245, .7);
      --ink-3: rgba(235, 235, 245, .52);
      --line: rgba(235, 235, 245, .18);
      --line-strong: rgba(235, 235, 245, .3);
      --accent: #0A84FF;
      --accent-soft: rgba(10, 132, 255, .22);
      --accent-ink: #FFFFFF;
      --deep: #30D158;
      --on-deep: #000000;
      --metal-a: rgba(72, 72, 74, .92);
      --metal-b: rgba(28, 28, 30, .8);
      --blob-a: rgba(10, 132, 255, .46);
      --blob-b: rgba(255, 55, 95, .32);
      --blob-c: rgba(94, 92, 230, .38);
      --g-top: .16;
      --g-mid: .07;
      --g-bot: .12;
      --g-edge: rgba(255, 255, 255, .16);
      --g-sheen: rgba(255, 255, 255, .22);
      --shadow: 0 .5px 1px rgba(0, 0, 0, .5), 0 8px 24px -10px rgba(0, 0, 0, .7);
      --shadow-lift: 0 1px 2px rgba(0, 0, 0, .6), 0 24px 56px -20px rgba(0, 0, 0, .85);
    }
  }

  :root[data-theme="dark"] {
    --ground: #000000;
    --ground-2: #1C1C1E;
    --surface: #1C1C1E;
    --surface-2: rgba(120, 120, 128, .24);
    --glass: rgba(28, 28, 30, .68);
    --glass-line: rgba(255, 255, 255, .1);
    --ink: #FFFFFF;
    --ink-2: rgba(235, 235, 245, .7);
    --ink-3: rgba(235, 235, 245, .52);
    --line: rgba(235, 235, 245, .18);
    --line-strong: rgba(235, 235, 245, .3);
    --accent: #0A84FF;
    --accent-soft: rgba(10, 132, 255, .22);
    --accent-ink: #FFFFFF;
    --deep: #30D158;
    --on-deep: #000000;
    --metal-a: rgba(72, 72, 74, .92);
    --metal-b: rgba(28, 28, 30, .8);
    --blob-a: rgba(10, 132, 255, .46);
    --blob-b: rgba(255, 55, 95, .32);
    --blob-c: rgba(94, 92, 230, .38);
    --g-top: .16;
    --g-mid: .07;
    --g-bot: .12;
    --g-edge: rgba(255, 255, 255, .16);
    --g-sheen: rgba(255, 255, 255, .22);
    --shadow: 0 .5px 1px rgba(0, 0, 0, .5), 0 8px 24px -10px rgba(0, 0, 0, .7);
    --shadow-lift: 0 1px 2px rgba(0, 0, 0, .6), 0 24px 56px -20px rgba(0, 0, 0, .85);
  }

  /* ─── language type stacks ─── */
  :root[data-lang="ja"] {
    --display: -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", system-ui, sans-serif;
    --body: -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", system-ui, sans-serif;
  }

  :root[data-lang="zh"] {
    --display: -apple-system, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", system-ui, sans-serif;
    --body: -apple-system, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", system-ui, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--body);
    font-size: 17px;
    line-height: 1.47;
    letter-spacing: -.01em;
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
  }

  /* 유리가 굴절할 것이 있어야 유리로 보인다 — 흰 바탕 위를 천천히 흐르는 색 */
  body::before,
  body::after {
    content: "";
    position: fixed;
    inset: -30vh -25vw;
    z-index: -1;
    pointer-events: none;
    /* 일부러 흐리게 하지 않는다 — 유리가 뭉갤 또렷한 가장자리가 있어야 유리로 보인다 */
  }

  body::before {
    background:
      radial-gradient(26vw 26vw at 14% 16%, var(--blob-a) 0 42%, transparent 44%),
      radial-gradient(17vw 17vw at 34% 6%, var(--blob-c) 0 46%, transparent 48%),
      radial-gradient(30vw 30vw at 90% 22%, var(--blob-b) 0 40%, transparent 42%);
    animation: drift-a 34s ease-in-out infinite alternate;
  }

  body::after {
    background:
      radial-gradient(28vw 28vw at 78% 86%, var(--blob-c) 0 42%, transparent 44%),
      radial-gradient(19vw 19vw at 22% 88%, var(--blob-b) 0 44%, transparent 46%),
      radial-gradient(14vw 14vw at 56% 58%, var(--blob-a) 0 46%, transparent 48%);
    animation: drift-b 44s ease-in-out infinite alternate;
  }

  @keyframes drift-a {
    from { transform: translate3d(0, 0, 0) scale(1); }
    to   { transform: translate3d(4vw, 5vh, 0) scale(1.12); }
  }

  @keyframes drift-b {
    from { transform: translate3d(0, 0, 0) scale(1.08); }
    to   { transform: translate3d(-5vw, -4vh, 0) scale(1); }
  }

  /* ─── 리퀴드 글래스 ───
     반투명 채움 + 배경 굴절(blur·saturate) + 위쪽 스페큘러 하이라이트 +
     테두리 광택 + 바닥 그림자. 다섯 겹이 모여야 유리로 읽힌다 */
  .glass {
    background:
      linear-gradient(155deg,
        rgba(255, 255, 255, var(--g-top)) 0%,
        rgba(255, 255, 255, var(--g-mid)) 46%,
        rgba(255, 255, 255, var(--g-bot)) 100%);
    backdrop-filter: blur(28px) saturate(210%) brightness(1.04);
    -webkit-backdrop-filter: blur(28px) saturate(210%) brightness(1.04);
    border: .5px solid var(--g-edge);
    box-shadow:
      inset 0 1px 0 var(--g-sheen),
      inset 0 0 0 .5px rgba(255, 255, 255, .12),
      inset 0 -14px 26px -20px rgba(0, 0, 0, .22),
      var(--shadow);
  }

  .page {
    max-width: 1060px;
    margin: 0 auto;
    padding: 44px 20px 80px;
    display: flex;
    flex-direction: column;
    gap: 30px;
  }

  /* ─── masthead ─── */
  .masthead {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px 24px;
  }

  .masthead-text { display: flex; flex-direction: column; gap: 6px; flex: 1 1 320px; min-width: 0; }

  h1 {
    font-family: var(--display);
    font-weight: 700;
    font-size: clamp(1.75rem, 5.4vw, 2.125rem);
    letter-spacing: -.028em;
    line-height: 1.08;
    text-wrap: balance;
    margin: 0;
  }

  .dek { margin: 0; max-width: 42ch; color: var(--ink-2); font-size: 15px; line-height: 1.45; }

  /* ─── header tools ─── */
  .masthead-tools { display: flex; align-items: center; gap: 8px; flex: none; }

  .lang, .theme-pick { position: relative; flex: none; }

  .icon-btn, .lang-toggle {
    /* .glass 와 함께 쓰인다 */
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    height: 36px;
    padding: 0 12px;
    font-family: var(--body);
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0;
    color: var(--accent);
    border-radius: 999px;
    cursor: pointer;
    transition: background .18s ease, transform .12s ease;
  }

  .icon-btn { width: 36px; padding: 0; }
  .icon-btn:active, .lang-toggle:active { transform: scale(.96); }
  .icon-btn[aria-expanded="true"], .lang-toggle[aria-expanded="true"] { background: var(--accent-soft); }
  .icon-btn svg, .lang-toggle svg { width: 18px; height: 18px; display: block; }

  /* ─── popovers (iOS menu) ─── */
  .theme-menu, .lang-menu {
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    z-index: 20;
    padding: 7px;
    border-radius: 18px;
    animation: pop .18s cubic-bezier(.2, .9, .3, 1);
  }

  .theme-menu { display: grid; grid-template-columns: repeat(3, 88px); gap: 4px; }
  .lang-menu { display: flex; flex-direction: column; gap: 1px; min-width: 184px; }
  .theme-menu[hidden], .lang-menu[hidden] { display: none; }

  @keyframes pop { from { opacity: 0; transform: translateY(-6px) scale(.98); } to { opacity: 1; transform: none; } }

  @media (max-width: 520px) { .theme-menu { grid-template-columns: repeat(2, 88px); } }

  .lang-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    width: 100%;
    font-family: var(--body);
    font-size: 16px;
    color: var(--ink);
    background: transparent;
    border: none;
    border-radius: 10px;
    padding: 10px 12px;
    text-align: left;
    cursor: pointer;
  }

  .lang-item:hover { background: var(--surface-2); }
  .lang-item[aria-checked="true"] { color: var(--accent); font-weight: 600; }
  .lang-item .tick { font-size: 14px; opacity: 0; }
  .lang-item[aria-checked="true"] .tick { opacity: 1; }

  .theme-card {
    display: flex;
    flex-direction: column;
    gap: 5px;
    padding: 6px;
    background: transparent;
    border: 1.5px solid transparent;
    border-radius: 12px;
    cursor: pointer;
  }

  .theme-card:hover { background: var(--surface-2); }
  .theme-card[aria-checked="true"] { border-color: var(--accent); }

  .theme-swatch {
    display: flex;
    gap: 3px;
    justify-content: center;
    padding: 9px 5px;
    border-radius: 9px;
    border: .5px solid var(--line);
  }

  .theme-swatch i { width: 10px; height: 10px; border-radius: 50%; display: block; }
  .theme-name { font-size: 12px; color: var(--ink-2); text-align: center; letter-spacing: 0; }
  .theme-card[aria-checked="true"] .theme-name { color: var(--accent); font-weight: 600; }

  /* ─── stage ─── */
  .stage {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(320px, .9fr);
    gap: 28px;
    align-items: start;
  }

  @media (max-width: 860px) { .stage { grid-template-columns: minmax(0, 1fr); gap: 24px; } }

  /* ─── segmented control ─── */
  .mode-switch {
    display: inline-flex;
    gap: 2px;
    padding: 3px;
    border-radius: 12px;
  }

  .mode-btn {
    font-family: var(--body);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: -.01em;
    color: var(--ink);
    background: transparent;
    border: none;
    border-radius: 8px;
    padding: 7px 18px;
    cursor: pointer;
    transition: background .2s ease, box-shadow .2s ease;
  }

  .mode-btn[aria-pressed="true"] {
    background: rgba(255, 255, 255, .92);
    color: #000;
    box-shadow: 0 .5px 2px rgba(0, 0, 0, .14), 0 4px 10px -4px rgba(0, 0, 0, .2);
  }

  /* ─── wheel column ─── */
  .wheel-col { display: flex; flex-direction: column; align-items: center; gap: 26px; }

  .wheel-wrap { position: relative; width: 100%; max-width: 440px; aspect-ratio: 1; }

  /* 원판이 유리판 위에 놓인 것처럼 */
  .wheel-plate {
    position: absolute;
    inset: -1.5%;
    border-radius: 50%;
    z-index: 0;
    pointer-events: none;
  }

  .result-card, .theme-menu, .lang-menu {
    backdrop-filter: blur(44px) saturate(220%) brightness(1.05);
    -webkit-backdrop-filter: blur(44px) saturate(220%) brightness(1.05);
  }

  .hub { backdrop-filter: blur(18px) saturate(200%); -webkit-backdrop-filter: blur(18px) saturate(200%); }

  canvas { display: block; width: 100%; height: 100%; position: relative; z-index: 1; }

  .needle {
    position: absolute;
    top: -1px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 9px solid transparent;
    border-right: 9px solid transparent;
    border-top: 18px solid var(--ink);
    filter: drop-shadow(0 2px 3px rgba(0, 0, 0, .25));
    pointer-events: none;
    z-index: 3;
  }

  .hub {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 28%;
    aspect-ratio: 1;
    border-radius: 50%;
    color: var(--ink);
    font-family: var(--body);
    font-weight: 600;
    font-size: clamp(13px, 3.2vw, 16px);
    letter-spacing: -.01em;
    cursor: pointer;
    z-index: 2;
    box-shadow: 0 1px 3px rgba(0, 0, 0, .16), 0 12px 28px -12px rgba(0, 0, 0, .3);
    transition: transform .14s ease;
  }

  .hub:hover:not(:disabled) { transform: translate(-50%, -50%) scale(1.03); }
  .hub:active:not(:disabled) { transform: translate(-50%, -50%) scale(.96); }
  .hub:disabled { cursor: default; color: var(--ink-3); }

  .spin-btn {
    width: min(340px, 100%);
    min-height: 50px;
    font-family: var(--body);
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -.01em;
    color: var(--accent-ink);
    background: var(--accent);
    border: none;
    border-radius: 14px;
    padding: 14px 24px;
    cursor: pointer;
    transition: opacity .16s ease, transform .12s ease;
  }

  .spin-btn:hover:not(:disabled) { opacity: .88; }
  .spin-btn:active:not(:disabled) { transform: scale(.985); }
  .spin-btn:disabled { background: var(--surface-2); color: var(--ink-3); cursor: default; }
  .spin-btn.deep { background: var(--deep); color: var(--on-deep); }

  .under-wheel { display: flex; flex-direction: column; align-items: center; gap: 10px; min-height: 40px; text-align: center; }

  .hint { margin: 0; font-size: 13px; color: var(--ink-3); letter-spacing: 0; }
  .hint.warn { color: var(--accent); font-weight: 600; }
  .hints { display: flex; flex-direction: column; gap: 2px; }

  /* ─── history row ─── */
  .history { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; }
  .history-chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }

  .history-label { font-size: 13px; color: var(--ink-3); letter-spacing: 0; }
  .history-empty { font-size: 13px; color: var(--ink-3); }
  .history-empty[hidden] { display: none; }

  .history-item {
    font-size: 13px;
    color: var(--ink-2);
    background: var(--surface-2);
    border-radius: 8px;
    padding: 3px 9px;
    max-width: 108px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .history-item:first-of-type { color: var(--ink); font-weight: 600; }

  .history-tools { display: flex; align-items: center; gap: 8px; flex: none; }

  .link-btn {
    font-family: var(--body);
    font-size: 13px;
    font-weight: 500;
    color: var(--accent);
    background: none;
    border: none;
    padding: 2px 0;
    cursor: pointer;
  }

  .link-btn:hover:not(:disabled) { opacity: .7; }
  .link-btn:disabled { color: var(--ink-3); cursor: default; }

  .info-btn {
    width: 20px;
    height: 20px;
    flex: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    font-family: var(--body);
    font-size: 12px;
    font-weight: 600;
    line-height: 1;
    color: var(--ink-3);
    background: var(--surface-2);
    border: none;
    border-radius: 50%;
    cursor: pointer;
  }

  .info-btn:hover { color: var(--ink); }
  .info-btn[aria-expanded="true"] { color: var(--accent-ink); background: var(--accent); }

  .note {
    margin: 0;
    max-width: 34ch;
    font-size: 13px;
    line-height: 1.45;
    color: var(--ink-2);
    text-align: left;
    border-radius: 16px;
    padding: 12px 14px;
  }

  .note[hidden] { display: none; }

  /* ─── panel (glass card) ─── */
  .panel {
    border-radius: 26px;
    padding: 22px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* ─── category tabs ─── */
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; }

  .tab {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: var(--body);
    font-size: 14px;
    font-weight: 500;
    color: var(--ink-2);
    background: var(--surface-2);
    border: none;
    border-radius: 999px;
    padding: 7px 14px;
    cursor: pointer;
    transition: background .16s ease, color .16s ease;
  }

  .tab:hover { color: var(--ink); }
  .tab[aria-selected="true"] { color: var(--accent-ink); background: var(--accent); font-weight: 600; }

  .tab-x {
    display: none;
    width: 16px;
    height: 16px;
    padding: 0;
    font-size: 14px;
    line-height: 1;
    color: inherit;
    background: transparent;
    border: none;
    cursor: pointer;
    opacity: .7;
  }

  .tab[aria-selected="true"] .tab-x { display: inline-block; }
  .tab-x:hover { opacity: 1; }
  .tab.confirm { background: #FF3B30; color: #FFFFFF; }

  .tab-add {
    font-size: 15px;
    color: var(--ink-3);
    background: var(--surface-2);
    border: none;
    border-radius: 999px;
    padding: 7px 13px;
    cursor: pointer;
  }

  .tab-add:hover { color: var(--accent); }

  .tab-input {
    font-family: var(--body);
    font-size: 14px;
    font-weight: 500;
    width: 116px;
    color: var(--ink);
    background: var(--surface);
    border: 1.5px solid var(--accent);
    border-radius: 999px;
    padding: 6px 13px;
  }

  /* ─── list ─── */
  .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }

  .panel-title { font-family: var(--display); font-weight: 600; font-size: 17px; letter-spacing: -.01em; margin: 0; }
  .count { font-size: 14px; color: var(--ink-3); font-variant-numeric: tabular-nums; }

  .add-row { display: flex; gap: 8px; }

  input[type="text"] {
    flex: 1;
    min-width: 0;
    font-family: var(--body);
    font-size: 16px;
    color: var(--ink);
    background: var(--surface-2);
    border: none;
    border-radius: 12px;
    padding: 12px 14px;
  }

  input[type="text"]::placeholder { color: var(--ink-3); }
  input[type="text"]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

  .add-btn {
    font-family: var(--body);
    font-weight: 600;
    font-size: 16px;
    letter-spacing: -.01em;
    color: var(--accent-ink);
    background: var(--accent);
    border: none;
    border-radius: 12px;
    padding: 0 18px;
    cursor: pointer;
    transition: opacity .16s ease;
  }

  .add-btn:hover { opacity: .88; }

  .list { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--surface-2);
    border: none;
    border-radius: 11px;
    padding: 8px 9px 8px 11px;
    font-size: 15px;
    max-width: 100%;
  }

  /* iOS 답게 색 띠 대신 색 점 */
  .chip::before {
    content: "";
    flex: none;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--chip, var(--ink-3));
  }

  .chip.dup { animation: nudge .32s ease; }
  .chip.skipped { opacity: .5; }
  .chip.skipped .chip-name { text-decoration: line-through; color: var(--ink-3); }

  @keyframes nudge {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-4px); }
    75% { transform: translateX(4px); }
  }

  .chip-name {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-family: var(--body);
    font-size: 15px;
    color: var(--ink);
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    letter-spacing: -.01em;
  }

  .chip-name:hover { color: var(--accent); }

  .chip-odds { flex: none; font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }

  .chip-x {
    flex: none;
    width: 20px;
    height: 20px;
    border: none;
    border-radius: 50%;
    background: transparent;
    color: var(--ink-3);
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
  }

  .chip-x:hover { background: var(--line); color: var(--ink); }

  .empty {
    margin: 0;
    padding: 20px 0;
    font-size: 15px;
    color: var(--ink-3);
    text-align: center;
    background: var(--surface-2);
    border-radius: 14px;
  }

  /* ─── sitting-out tray ─── */
  .tray {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    padding: 12px;
    border: 1px dashed var(--line-strong);
    border-radius: 14px;
  }

  .tray[hidden] { display: none; }
  .tray-label { font-size: 13px; color: var(--ink-3); flex: none; }
  .tray-list { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }

  .tray-item {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    max-width: 100%;
    padding: 5px 7px 5px 11px;
    font-size: 14px;
    color: var(--ink-3);
    background: transparent;
    border: 1px dashed var(--line-strong);
    border-radius: 10px;
  }

  .tray-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .tray-back {
    flex: none;
    width: 20px;
    height: 20px;
    padding: 0;
    border: none;
    border-radius: 50%;
    background: transparent;
    color: var(--accent);
    font-size: 13px;
    line-height: 1;
    cursor: pointer;
  }

  .tray-back:hover { background: var(--accent-soft); }

  /* ─── footer settings ─── */
  .panel-foot { display: flex; flex-direction: column; gap: 14px; padding-top: 4px; }

  .switches { display: flex; flex-direction: column; width: 100%; }

  .switch-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    padding: 11px 0;
    cursor: pointer;
  }

  .switch-row + .switch-row { border-top: .5px solid var(--line); }
  .switch-label { font-size: 16px; color: var(--ink); letter-spacing: -.01em; }

  .switch-input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

  .switch-track {
    position: relative;
    flex: none;
    width: 51px;
    height: 31px;
    border-radius: 999px;
    background: rgba(120, 120, 128, .16);
    transition: background .24s ease;
  }

  .switch-thumb {
    position: absolute;
    top: 2px;
    left: 2px;
    width: 27px;
    height: 27px;
    border-radius: 50%;
    background: #FFFFFF;
    box-shadow: 0 3px 8px rgba(0, 0, 0, .15), 0 1px 1px rgba(0, 0, 0, .16);
    transition: transform .24s cubic-bezier(.3, .8, .4, 1);
  }

  .switch-input:checked ~ .switch-track { background: var(--deep); }
  .switch-input:checked ~ .switch-track .switch-thumb { transform: translateX(20px); }
  .switch-input:focus-visible ~ .switch-track { outline: 2px solid var(--accent); outline-offset: 3px; }

  .switch-row.off { opacity: .4; cursor: default; }

  .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; width: 100%; }

  .ghost {
    font-family: var(--body);
    font-size: 15px;
    font-weight: 500;
    color: var(--accent);
    background: var(--accent-soft);
    border: none;
    border-radius: 11px;
    padding: 9px 15px;
    cursor: pointer;
    transition: opacity .16s ease;
  }

  .ghost:hover:not(:disabled) { opacity: .75; }
  .ghost:disabled { color: var(--ink-3); background: var(--surface-2); cursor: default; }

  .icon-ghost {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 38px;
    height: 38px;
    padding: 0;
    color: var(--accent);
    background: var(--accent-soft);
    border: none;
    border-radius: 50%;
    cursor: pointer;
    transition: opacity .16s ease, transform .12s ease;
  }

  .icon-ghost:hover { opacity: .75; }
  .icon-ghost:active { transform: scale(.94); }
  .icon-ghost svg { width: 19px; height: 19px; display: block; }

  .icon-ghost::after {
    content: attr(data-tip);
    position: absolute;
    bottom: calc(100% + 8px);
    left: 50%;
    transform: translateX(-50%);
    white-space: nowrap;
    font-size: 13px;
    font-weight: 500;
    color: var(--ground);
    background: var(--ink);
    border-radius: 8px;
    padding: 6px 10px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .16s ease;
  }

  .icon-ghost:hover::after, .icon-ghost:focus-visible::after { opacity: 1; }

  .share-out { width: 100%; font-family: var(--mono); font-size: 13px; }
  .share-out[hidden] { display: none; }

  /* ─── result sheet ─── */
  .overlay {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(0, 0, 0, .28);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    animation: fade .22s ease;
  }

  .overlay[hidden] { display: none; }

  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

  .result-card {
    position: relative;
    text-align: center;
    width: min(420px, 100%);
    border-radius: 30px;
    padding: 26px 24px 22px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    animation: rise .34s cubic-bezier(.16, .84, .32, 1);
  }

  @keyframes rise { from { opacity: 0; transform: translateY(16px) scale(.97); } to { opacity: 1; transform: none; } }

  .card-close {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 30px;
    height: 30px;
    padding: 0;
    font-size: 17px;
    line-height: 1;
    color: var(--ink-3);
    background: var(--surface-2);
    border: none;
    border-radius: 50%;
    cursor: pointer;
  }

  .card-close:hover { color: var(--ink); }

  .result-shot {
    display: block;
    width: min(220px, 60%);
    aspect-ratio: 1;
    margin: 6px auto 0;
    border-radius: 18px;
    background: var(--ground-2);
  }

  .eyebrow { margin: 0; font-size: 15px; color: var(--ink-2); letter-spacing: -.01em; }

  .result-name {
    font-family: var(--display);
    align-self: center;
    font-weight: 700;
    font-size: clamp(1.75rem, 7vw, 2.375rem);
    letter-spacing: -.03em;
    line-height: 1.1;
    margin: -8px 0 0;
    text-wrap: balance;
    overflow-wrap: anywhere;
    color: var(--ink);
  }

  .result-meta { margin: -10px 0 0; font-size: 13px; color: var(--ink-3); }

  /* 뽑힌 조각의 색은 이름 대신 이 점으로 잇는다 */
  .result-meta::before {
    content: "";
    display: inline-block;
    width: 7px;
    height: 7px;
    margin-right: 7px;
    border-radius: 50%;
    vertical-align: 1px;
    background: var(--win, var(--accent));
  }

  .result-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .result-actions .spin-btn { flex: 1 1 160px; width: auto; min-height: 46px; font-size: 16px; padding: 12px 18px; }
  .result-actions .ghost { flex: 0 1 auto; }

  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>
