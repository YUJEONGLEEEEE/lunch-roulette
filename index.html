<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="description" content="점심 먹을 식당을 랜덤으로 골라주는 돌림판." />
<meta name="color-scheme" content="light dark" />
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#EFF1EB" />
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0E1412" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="오늘 뭐 먹지?" />
<link rel="apple-touch-icon" href="icon-180.png" />
<link rel="icon" href="icon-192.png" />
<link rel="manifest" href="manifest.webmanifest" />
<title>오늘 뭐 먹지?</title>
<style>
  /* ─── tokens: light (bare :root = complete palette) ─── */
  :root {
    --ground: #EFF1EB;
    --surface: #FFFFFF;
    --surface-2: #E5E9DF;
    --ink: #141C18;
    --ink-2: #4B564E;
    --ink-3: #7D887F;
    --line: #D3D9CD;
    --line-strong: #B9C2B3;
    --accent: #D9482A;
    --accent-soft: #F6DED6;
    --accent-ink: #FFFFFF;
    --deep: #1C5347;
    --on-deep: #FFFFFF;
    --metal-a: #F7F9F4;
    --metal-b: #C6CEC2;
    --shadow: 0 1px 2px rgba(20, 28, 24, .06), 0 12px 32px -12px rgba(20, 28, 24, .22);
    --shadow-lift: 0 2px 4px rgba(20, 28, 24, .08), 0 26px 60px -20px rgba(20, 28, 24, .34);

    --display: "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
    --body: "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  }

  /* ─── tokens: dark via OS (explicit light choice still wins) ─── */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #0E1412;
      --surface: #161D1A;
      --surface-2: #1F2724;
      --ink: #E9EDE6;
      --ink-2: #A8B3AB;
      --ink-3: #79847C;
      --line: #2A332E;
      --line-strong: #3A453E;
      --accent: #F2704A;
      --accent-soft: #33201A;
      --accent-ink: #1A0F0A;
      --deep: #7FC0AE;
      --on-deep: #0E1412;
      --metal-a: #2C352F;
      --metal-b: #131917;
      --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 12px 32px -12px rgba(0, 0, 0, .7);
      --shadow-lift: 0 2px 4px rgba(0, 0, 0, .55), 0 26px 60px -20px rgba(0, 0, 0, .8);
    }
  }

  /* ─── tokens: dark via explicit toggle ─── */
  :root[data-theme="dark"] {
    --ground: #0E1412;
    --surface: #161D1A;
    --surface-2: #1F2724;
    --ink: #E9EDE6;
    --ink-2: #A8B3AB;
    --ink-3: #79847C;
    --line: #2A332E;
    --line-strong: #3A453E;
    --accent: #F2704A;
    --accent-soft: #33201A;
    --accent-ink: #1A0F0A;
    --deep: #7FC0AE;
    --on-deep: #0E1412;
    --metal-a: #2C352F;
    --metal-b: #131917;
    --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 12px 32px -12px rgba(0, 0, 0, .7);
    --shadow-lift: 0 2px 4px rgba(0, 0, 0, .55), 0 26px 60px -20px rgba(0, 0, 0, .8);
  }

  /* ─── type stacks per language ─── */
  :root[data-lang="en"], :root[data-lang="es"], :root[data-lang="de"] {
    --display: -apple-system, "Segoe UI", "Helvetica Neue", system-ui, sans-serif;
    --body: -apple-system, "Segoe UI", "Helvetica Neue", system-ui, sans-serif;
  }

  :root[data-lang="ja"] {
    --display: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, system-ui, sans-serif;
    --body: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, system-ui, sans-serif;
  }

  :root[data-lang="zh"] {
    --display: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
    --body: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--body);
    font-size: 16px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
  }

  .page {
    max-width: 1120px;
    margin: 0 auto;
    padding: 40px 20px 72px;
    display: flex;
    flex-direction: column;
    gap: 32px;
  }

  /* ─── masthead ─── */
  .masthead {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-start;
    justify-content: space-between;
    gap: 18px 28px;
  }

  .masthead-text { display: flex; flex-direction: column; gap: 8px; flex: 1 1 340px; min-width: 0; }

  .eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0;
  }

  h1 {
    font-family: var(--display);
    font-weight: 900;
    font-size: clamp(2rem, 6vw, 3.1rem);
    letter-spacing: -.045em;
    line-height: 1.02;
    text-wrap: balance;
    margin: 0;
  }

  .dek {
    margin: 0;
    max-width: 46ch;
    color: var(--ink-2);
    font-size: 15px;
  }

  /* ─── header tools: theme + language ─── */
  .masthead-tools { display: flex; align-items: flex-start; gap: 8px; flex: none; }

  .lang, .theme-pick { position: relative; flex: none; }

  .icon-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 8px 11px;
    color: var(--ink-2);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 999px;
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: color .18s ease, border-color .18s ease;
  }

  .icon-btn:hover { color: var(--ink); border-color: var(--line-strong); }
  .icon-btn[aria-expanded="true"] { color: var(--accent); border-color: var(--accent); }
  .icon-btn svg { width: 16px; height: 16px; display: block; }

  .theme-menu {
    position: absolute;
    top: calc(100% + 6px);
    right: 0;
    z-index: 20;
    padding: 8px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: var(--shadow-lift);
    display: grid;
    grid-template-columns: repeat(3, 92px);
    gap: 5px;
    animation: pop .16s ease;
  }

  .theme-menu[hidden] { display: none; }

  @media (max-width: 520px) {
    .theme-menu { grid-template-columns: repeat(2, 92px); }
  }

  .theme-card {
    display: flex;
    flex-direction: column;
    gap: 5px;
    padding: 6px;
    background: transparent;
    border: 1px solid transparent;
    border-radius: 10px;
    cursor: pointer;
    text-align: left;
    transition: background .14s ease, border-color .14s ease;
  }

  .theme-card:hover { background: var(--surface-2); }
  .theme-card[aria-checked="true"] { border-color: var(--accent); }

  .theme-swatch {
    display: flex;
    gap: 3px;
    justify-content: center;
    padding: 8px 5px;
    border-radius: 7px;
    border: 1px solid rgba(128, 128, 128, .22);
  }

  .theme-swatch i { width: 11px; height: 11px; border-radius: 50%; display: block; }

  .theme-name { font-family: var(--body); font-size: 12px; color: var(--ink-2); text-align: center; }
  .theme-card[aria-checked="true"] .theme-name { color: var(--accent); font-weight: 700; }

  /* ─── language menu ─── */
  .lang-toggle {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .1em;
    color: var(--ink-2);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 8px 14px 8px 11px;
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: color .18s ease, border-color .18s ease;
  }

  .lang-toggle:hover { color: var(--ink); border-color: var(--line-strong); }
  .lang-toggle[aria-expanded="true"] { color: var(--accent); border-color: var(--accent); }
  .lang-toggle svg { width: 15px; height: 15px; flex: none; }

  .lang-menu {
    position: absolute;
    top: calc(100% + 6px);
    right: 0;
    z-index: 20;
    min-width: 168px;
    padding: 6px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    box-shadow: var(--shadow-lift);
    display: flex;
    flex-direction: column;
    gap: 2px;
    animation: pop .16s ease;
  }

  .lang-menu[hidden] { display: none; }

  @keyframes pop { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: none; } }

  .lang-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    width: 100%;
    font-family: var(--body);
    font-size: 14.5px;
    color: var(--ink);
    background: transparent;
    border: none;
    border-radius: 8px;
    padding: 9px 11px;
    text-align: left;
    cursor: pointer;
    transition: background .14s ease;
  }

  .lang-item:hover { background: var(--surface-2); }
  .lang-item[aria-checked="true"] { color: var(--accent); font-weight: 700; }
  .lang-item .tick { font-family: var(--mono); font-size: 12px; opacity: 0; }
  .lang-item[aria-checked="true"] .tick { opacity: 1; }

  /* ─── stage ─── */
  .stage {
    display: grid;
    grid-template-columns: minmax(0, 1.05fr) minmax(320px, .95fr);
    gap: 32px;
    align-items: start;
  }

  @media (max-width: 860px) {
    .stage { grid-template-columns: minmax(0, 1fr); gap: 26px; }
  }

  /* ─── wheel column ─── */
  .wheel-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
  }

  .wheel-wrap {
    position: relative;
    width: 100%;
    max-width: 460px;
    aspect-ratio: 1;
  }

  canvas { display: block; width: 100%; height: 100%; }

  .needle {
    position: absolute;
    top: -2px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 11px solid transparent;
    border-right: 11px solid transparent;
    border-top: 22px solid var(--accent);
    filter: drop-shadow(0 3px 4px rgba(0, 0, 0, .3));
    pointer-events: none;
    z-index: 3;
  }

  .hub {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 27%;
    aspect-ratio: 1;
    border-radius: 50%;
    border: 1px solid var(--line-strong);
    background: linear-gradient(160deg, var(--metal-a), var(--metal-b));
    color: var(--ink);
    font-family: var(--display);
    font-weight: 900;
    font-size: clamp(12px, 3.1vw, 16px);
    letter-spacing: -.03em;
    cursor: pointer;
    z-index: 2;
    box-shadow: 0 6px 18px -6px rgba(0, 0, 0, .45), inset 0 1px 0 rgba(255, 255, 255, .35);
    transition: transform .12s ease, box-shadow .18s ease;
  }

  .hub:hover:not(:disabled) { transform: translate(-50%, -50%) scale(1.04); }
  .hub:active:not(:disabled) { transform: translate(-50%, -50%) scale(.97); }
  .hub:disabled { cursor: default; color: var(--ink-3); }

  .spin-btn {
    font-family: var(--display);
    font-weight: 900;
    font-size: 19px;
    letter-spacing: -.02em;
    color: var(--accent-ink);
    background: var(--accent);
    border: none;
    border-radius: 999px;
    padding: 15px 40px;
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: transform .12s ease, filter .18s ease;
  }

  .spin-btn:hover:not(:disabled) { filter: brightness(1.07); }
  .spin-btn:active:not(:disabled) { transform: translateY(1px) scale(.99); }
  .spin-btn:disabled { background: var(--surface-2); color: var(--ink-3); box-shadow: none; cursor: default; }

  .under-wheel {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    min-height: 44px;
    text-align: center;
  }

  .hint { margin: 0; font-size: 13px; color: var(--ink-3); }
  .hint.warn { color: var(--accent); font-weight: 700; }

  .history {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    align-items: center;
  }

  .history-chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }

  .history-empty { font-size: 12.5px; color: var(--ink-3); }
  .history-empty[hidden] { display: none; }

  .link-btn {
    font-family: var(--body);
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink-3);
    background: none;
    border: none;
    padding: 2px 0;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
    text-decoration-color: var(--line-strong);
    transition: color .18s ease;
  }

  .link-btn:hover:not(:disabled) { color: var(--accent); text-decoration-color: var(--accent); }
  .link-btn:disabled { color: var(--line-strong); cursor: default; text-decoration: none; }

  .history-label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .05em;
    text-transform: uppercase;
    color: var(--ink-3);
  }

  .history-item {
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--ink-2);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 2px 7px;
    max-width: 92px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* 지우기와 ⓘ 는 한 덩어리로 — 줄이 접혀도 떨어지지 않는다 */
  .history-tools { display: flex; align-items: center; gap: 7px; flex: none; }

  .history-item:first-of-type { border-color: var(--line-strong); color: var(--ink); }

  .info-btn {
    width: 19px;
    height: 19px;
    flex: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 700;
    line-height: 1;
    color: var(--ink-3);
    background: transparent;
    border: 1px solid var(--line-strong);
    border-radius: 50%;
    cursor: pointer;
    transition: color .18s ease, border-color .18s ease, background .18s ease;
  }

  .info-btn:hover { color: var(--ink); border-color: var(--ink-3); }

  .info-btn[aria-expanded="true"] {
    color: var(--accent);
    border-color: var(--accent);
    background: var(--accent-soft);
  }

  .note {
    margin: 0;
    max-width: 36ch;
    font-size: 12.5px;
    line-height: 1.55;
    color: var(--ink-2);
    text-align: left;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 11px 13px;
    box-shadow: var(--shadow);
    animation: pop .16s ease;
  }

  .note[hidden] { display: none; }

  /* ─── panel ─── */
  .panel {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: var(--shadow);
    padding: 22px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }

  .panel-title {
    font-family: var(--display);
    font-weight: 900;
    font-size: 17px;
    letter-spacing: -.03em;
    margin: 0;
  }

  .count { font-family: var(--mono); font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }

  .add-row { display: flex; gap: 8px; }

  input[type="text"] {
    flex: 1;
    min-width: 0;
    font-family: var(--body);
    font-size: 15px;
    color: var(--ink);
    background: var(--ground);
    border: 1px solid var(--line-strong);
    border-radius: 9px;
    padding: 11px 13px;
  }

  input[type="text"]::placeholder { color: var(--ink-3); }
  input[type="text"]:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }

  .add-btn {
    font-family: var(--display);
    font-weight: 800;
    font-size: 15px;
    letter-spacing: -.02em;
    color: var(--on-deep);
    background: var(--deep);
    border: none;
    border-radius: 9px;
    padding: 0 18px;
    cursor: pointer;
    transition: filter .18s ease;
  }

  .add-btn:hover { filter: brightness(1.1); }

  .list { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--ground);
    border: 1px solid var(--line);
    border-left: 4px solid var(--chip, var(--line-strong));
    border-radius: 8px;
    padding: 7px 8px 7px 10px;
    font-size: 14.5px;
    max-width: 100%;
  }

  .chip.dup { animation: nudge .34s ease; border-color: var(--accent); }

  @keyframes nudge {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-4px); }
    75% { transform: translateX(4px); }
  }

  .chip-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .chip-odds {
    flex: none;
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--ink-3);
    font-variant-numeric: tabular-nums;
  }

  .chip-x {
    flex: none;
    width: 20px;
    height: 20px;
    border: none;
    border-radius: 5px;
    background: transparent;
    color: var(--ink-3);
    font-family: var(--mono);
    font-size: 14px;
    line-height: 1;
    cursor: pointer;
  }

  .chip-x:hover { background: var(--accent-soft); color: var(--accent); }

  .empty {
    margin: 0;
    padding: 18px 0;
    font-size: 14px;
    color: var(--ink-3);
    text-align: center;
    border: 1px dashed var(--line-strong);
    border-radius: 10px;
  }

  .panel-foot {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding-top: 14px;
    border-top: 1px solid var(--line);
  }

  .ghost {
    font-family: var(--body);
    font-size: 13px;
    font-weight: 700;
    color: var(--ink-2);
    background: transparent;
    border: 1px solid var(--line-strong);
    border-radius: 8px;
    padding: 8px 12px;
    cursor: pointer;
    transition: background .18s ease, color .18s ease;
  }

  .ghost:hover { background: var(--surface-2); color: var(--ink); }

  .ghost[aria-pressed="true"] {
    border-color: var(--accent);
    background: var(--accent-soft);
    color: var(--accent);
  }

  .share-out {
    width: 100%;
    font-family: var(--mono);
    font-size: 12px;
  }

  .share-out[hidden] { display: none; }

  /* ─── result ─── */
  .overlay {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: color-mix(in srgb, var(--ground) 72%, transparent);
    backdrop-filter: blur(7px);
    animation: fade .22s ease;
  }

  .overlay[hidden] { display: none; }

  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

  .result-card {
    width: min(460px, 100%);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: var(--shadow-lift);
    padding: 30px 28px 24px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    animation: rise .3s cubic-bezier(.16, .84, .32, 1);
  }

  @keyframes rise { from { opacity: 0; transform: translateY(14px) scale(.98); } to { opacity: 1; transform: none; } }

  .result-name {
    font-family: var(--display);
    font-weight: 900;
    font-size: clamp(1.9rem, 8vw, 2.9rem);
    letter-spacing: -.05em;
    line-height: 1.08;
    margin: 0;
    text-wrap: balance;
    overflow-wrap: anywhere;
    box-shadow: inset 0 -.32em 0 var(--win, var(--accent-soft));
  }

  .result-actions { display: flex; flex-wrap: wrap; gap: 8px; }

  .result-actions .spin-btn { flex: 1; padding: 13px 20px; font-size: 16px; }
  .result-actions .ghost { padding: 13px 16px; font-size: 14px; }

  .sr {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<div class="page">
  <header class="masthead">
    <div class="masthead-text">
      <p class="eyebrow">Lunch Roulette</p>
      <h1 data-i18n="title">오늘 뭐 먹지?</h1>

    var items = [];
    var history = [];
    var lang = "ko";
    var theme = "paper";
    var hintKey = "hintStart";
    var hintWarn = false;
    var soundOn = true;
    var rot = 0;
    var spinning = false;
    var weighted = true;

    /* 최근 1·2·3번째 결과에 곱하는 배수. 그 이전은 1 */
    var DECAY = [0.25, 0.5, 0.75];

    function S() { return STRINGS[lang] || STRINGS.en; }

    var canvas = document.getElementById("wheel");
    var ctx = canvas.getContext("2d");
    var hub = document.getElementById("hub");
    var spinBtn = document.getElementById("spin");
    var hint = document.getElementById("hint");
    var listEl = document.getElementById("list");
    var emptyEl = document.getElementById("empty");
    var countEl = document.getElementById("count");
    var chipsEl = document.getElementById("history-chips");
    var emptyHistEl = document.getElementById("history-empty");
    var clearHistBtn = document.getElementById("clear-history");
    var historyNote = document.getElementById("history-note");
    var infoBtn = document.getElementById("history-info");
    var input = document.getElementById("name");
    var overlay = document.getElementById("overlay");
    var resultName = document.getElementById("result-name");
    var shareOut = document.getElementById("share-out");
    var shareBtn = document.getElementById("share");
    var weightBtn = document.getElementById("weight");
    var themeBtn = document.getElementById("theme-toggle");
    var themeMenu = document.getElementById("theme-menu");
    var langBtn = document.getElementById("lang-toggle");
    var langMenu = document.getElementById("lang-menu");
    var langCode = document.getElementById("lang-code");

    /* ── theme + font values read from CSS ── */
    var css = {};
    function readTheme() {
      var s = getComputedStyle(document.documentElement);
      ["--surface", "--ground", "--ink", "--ink-3", "--line", "--line-strong", "--body"].forEach(function (k) {
        css[k] = s.getPropertyValue(k).trim();
      });
    }

    function wheelFont(weight, size) {
      return weight + " " + size + "px " + (css["--body"] || "system-ui, sans-serif");
    }

    /* ── color helpers ── */
    function colorFor(i, n) {
      var idx = i % PALETTE.length;
      // 마지막 조각이 첫 조각과 붙어 같은 색이 되는 경우만 비켜준다
      if (i === n - 1 && idx === 0 && n > 1) idx = Math.floor(PALETTE.length / 2);
      return PALETTE[idx];
    }

    /* ── 가중치: 최근에 나온 곳일수록 낮게 ── */
    function weightOf(name) {
      if (!weighted) return 1;
      var at = history.indexOf(name);
      return at === -1 ? 1 : (DECAY[at] || 1);
    }

    /* 조각 시작 각도와 폭을 가중치 비율 그대로 계산한다.
       추첨과 그리기가 같은 표를 쓰므로 보이는 넓이 = 실제 확률 */
    function layout() {
      var w = items.map(weightOf);
      var total = 0;
      var i;
      for (i = 0; i < w.length; i++) total += w[i];
      if (total <= 0) total = 1;

      var starts = [];
      var acc = 0;
      for (i = 0; i < w.length; i++) {
        starts.push(acc / total * TAU);
        acc += w[i];
      }
      return {
        w: w,
        total: total,
        starts: starts,
        angle: function (k) { return w[k] / total * TAU; }
      };
    }

    function wedgeAt(at, L) {
      var u = norm(-at);
      for (var i = L.starts.length - 1; i >= 0; i--) {
        if (u >= L.starts[i]) return i;
      }
      return 0;
    }

    function relLum(hex) {
      var r = parseInt(hex.slice(1, 3), 16) / 255;
      var g = parseInt(hex.slice(3, 5), 16) / 255;
      var b = parseInt(hex.slice(5, 7), 16) / 255;
      function lin(c) { return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); }
      return 0.2126 * lin(r) + 0.7152 * lin(g) + 0.0722 * lin(b);
    }

    function contrast(a, b) {
      var x = relLum(a), y = relLum(b);
      return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05);
    }

    /* 조각 글자색: 검정·흰색 중 대비가 더 높은 쪽. 고정 임계값보다 중간 밝기 색에서 훨씬 잘 읽힌다 */
    function textOn(hex) {
      return contrast(hex, "#171208") >= contrast(hex, "#FFFFFF") ? "#171208" : "#FFFFFF";
    }

    /* ── drawing ── */
    function sizeCanvas() {
      var box = canvas.parentNode.getBoundingClientRect();
      var side = Math.max(240, Math.min(box.width, box.height));
      var dpr = Math.min(window.devicePixelRatio || 1, 2.5);
      canvas.width = Math.round(side * dpr);
      canvas.height = Math.round(side * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      draw();
    }

    function draw() {
      var side = canvas.width / Math.min(window.devicePixelRatio || 1, 2.5);
      var cx = side / 2;
      var cy = side / 2;
      var r = side / 2 - 6;
      var hubR = side * 0.145;

      ctx.clearRect(0, 0, side, side);

      if (items.length === 0) {
        ctx.save();
        ctx.strokeStyle = css["--line-strong"];
        ctx.setLineDash([7, 8]);
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(cx, cy, r - 2, 0, TAU);
        ctx.stroke();
        ctx.setLineDash([]);

        // 문구는 허브 버튼에 가리지 않도록 허브 아래에, 필요하면 두 줄로
        var maxW = side * 0.62;
        var fs = Math.round(side * 0.042);
        var lines = wrapText(S().canvasEmpty, maxW, fs);
        while (fs > 11 && widest(lines, fs) > maxW) {
          fs -= 1;
          lines = wrapText(S().canvasEmpty, maxW, fs);
        }

        ctx.fillStyle = css["--ink-3"];
        ctx.font = wheelFont(700, fs);
        ctx.textAlign = "center";
        ctx.textBaseline = "top";
        var lh = fs * 1.36;
        var top = cy + hubR + side * 0.055;
        for (var li = 0; li < lines.length; li++) {
          ctx.fillText(lines[li], cx, top + li * lh);
        }
        ctx.restore();
        return;
      }

      var n = items.length;
      var L = layout();

      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(rot);

      for (var i = 0; i < n; i++) {
        var aw = L.angle(i);
        var a0 = -Math.PI / 2 + L.starts[i];
        var fill = colorFor(i, n);

        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, r, a0, a0 + aw);
        ctx.closePath();
        ctx.fillStyle = fill;
        ctx.fill();

        if (n <= 40) {
          ctx.strokeStyle = "rgba(0,0,0,.14)";
          ctx.lineWidth = 1;
          ctx.stroke();
        }

        // 조각 라벨
        var mid = a0 + aw / 2;
        var avail = r - 14 - hubR - 8;
        var byArc = aw * r * 0.5;
        var fs = Math.max(9, Math.min(side * 0.055, byArc, 30));

        ctx.save();
        ctx.rotate(mid);
        ctx.fillStyle = textOn(fill);
        ctx.font = wheelFont(800, fs.toFixed(1));
        ctx.textBaseline = "middle";

        var label = fit(items[i], avail);
        var abs = norm(mid + rot);
        var flipped = abs > Math.PI / 2 && abs < Math.PI * 1.5;

        if (flipped) {
          ctx.rotate(Math.PI);
          ctx.textAlign = "left";
          ctx.fillText(label, -(r - 14), 0);
        } else {
          ctx.textAlign = "right";
          ctx.fillText(label, r - 14, 0);
        }
        ctx.restore();
      }
      ctx.restore();

      // 림 + 안쪽 음영
      ctx.save();
      ctx.translate(cx, cy);
      var shade = ctx.createRadialGradient(0, 0, r * 0.3, 0, 0, r);
      shade.addColorStop(0, "rgba(0,0,0,0)");
      shade.addColorStop(1, "rgba(0,0,0,.16)");
      ctx.fillStyle = shade;
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, TAU);
      ctx.fill();

      ctx.strokeStyle = css["--surface"];
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.arc(0, 0, r + 1, 0, TAU);
      ctx.stroke();
      ctx.strokeStyle = css["--line-strong"];
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(0, 0, r - 1.5, 0, TAU);
      ctx.stroke();
      ctx.restore();
    }

    /* 띄어쓰기 기준 두 줄까지 접는다. 공백이 없는 언어는 한 줄 그대로 */
    function wrapText(text, maxW, fs) {
      ctx.font = wheelFont(700, fs);
      if (ctx.measureText(text).width <= maxW) return [text];

      var words = text.split(" ");
      if (words.length < 2) return [text];

      var best = null;
      for (var cut = 1; cut < words.length; cut++) {
        var a = words.slice(0, cut).join(" ");
        var b = words.slice(cut).join(" ");
        var worst = Math.max(ctx.measureText(a).width, ctx.measureText(b).width);
        if (!best || worst < best.worst) best = { lines: [a, b], worst: worst };
      }
      return best.lines;
    }

    function widest(lines, fs) {
      ctx.font = wheelFont(700, fs);
      var w = 0;
      for (var i = 0; i < lines.length; i++) w = Math.max(w, ctx.measureText(lines[i]).width);
      return w;
    }

    function fit(text, width) {
      if (ctx.measureText(text).width <= width) return text;
      var cut = text;
      while (cut.length > 1 && ctx.measureText(cut + "…").width > width) cut = cut.slice(0, -1);
      return cut + "…";
    }

    function norm(a) { return ((a % TAU) + TAU) % TAU; }

    /* ── sound ── */
    var audio = null;
    function tick() {
      if (!soundOn) return;
      try {
        if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
        var t = audio.currentTime;
        var osc = audio.createOscillator();
        var gain = audio.createGain();
        osc.type = "triangle";
        osc.frequency.setValueAtTime(1180, t);
        gain.gain.setValueAtTime(0.05, t);
        gain.gain.exponentialRampToValueAtTime(0.0006, t + 0.045);
        osc.connect(gain).connect(audio.destination);
        osc.start(t);
        osc.stop(t + 0.05);
      } catch (e) { soundOn = false; }
    }

    function chime() {
      if (!soundOn) return;
      try {
        if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
        [0, 0.09, 0.19].forEach(function (d, k) {
          var t = audio.currentTime + d;
          var osc = audio.createOscillator();
          var gain = audio.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime([660, 880, 1174][k], t);
          gain.gain.setValueAtTime(0.09, t);
          gain.gain.exponentialRampToValueAtTime(0.0008, t + 0.3);
          osc.connect(gain).connect(audio.destination);
          osc.start(t);
          osc.stop(t + 0.32);
        });
      } catch (e) { /* 소리는 없어도 게임은 돌아간다 */ }
    }

    /* ── spin ── */
    function randInt(max) {
      if (window.crypto && window.crypto.getRandomValues) {
        var limit = Math.floor(4294967296 / max) * max;
        var a = new Uint32Array(1);
        do { window.crypto.getRandomValues(a); } while (a[0] >= limit);
        return a[0] % max;
      }
      return Math.floor(Math.random() * max);
    }

    function randFloat() {
      if (window.crypto && window.crypto.getRandomValues) {
        var a = new Uint32Array(1);
        window.crypto.getRandomValues(a);
        return a[0] / 4294967296;
      }
      return Math.random();
    }

    function pickWeighted(L) {
      var x = randFloat() * L.total;
      for (var i = 0; i < L.w.length; i++) {
        x -= L.w[i];
        if (x < 0) return i;
      }
      return L.w.length - 1;
    }

    function spin() {
      if (spinning) return;
      if (items.length < 2) {
        setHint("hintNeedTwo", true);
        input.focus();
        return;
      }

      spinning = true;
      setBusy(true);
      setHint("spinning", false);

      var L = layout();
      var winner = pickWeighted(L);
      var aw = L.angle(winner);
      var center = L.starts[winner] + aw / 2;
      var jitter = (Math.random() - 0.5) * aw * 0.72;
      var target = norm(-center - jitter);
      var delta = norm(target - norm(rot));
      var turns = 5 + randInt(3);
      var from = rot;
      var to = from + turns * TAU + delta;

      var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      var dur = reduced ? 420 : 4200 + Math.random() * 700;
      var start = performance.now();
      var lastTickSlot = wedgeAt(from, L);
      var lastTickAt = 0;

      function frame(now) {
        var p = Math.min(1, (now - start) / dur);
        var eased = 1 - Math.pow(1 - p, 4);
        rot = from + (to - from) * eased;

        var slot = wedgeAt(rot, L);
        if (slot !== lastTickSlot) {
          lastTickSlot = slot;
          if (now - lastTickAt > 28) { tick(); lastTickAt = now; }
        }

        draw();
        if (p < 1) {
          requestAnimationFrame(frame);
        } else {
          rot = norm(to);
          draw();
          spinning = false;
          setBusy(false);
          finish(winner);
        }
      }
      requestAnimationFrame(frame);
    }

    function setBusy(on) {
      spinBtn.disabled = on;
      hub.disabled = on;
      hub.textContent = on ? "…" : S().hub;
      spinBtn.textContent = on ? S().spinning : S().spin;
    }

    function setHint(key, warn) {
      hintKey = key;
      hintWarn = !!warn;
      hint.textContent = key === "spinning" ? S().spinning : S()[key];
      hint.classList.toggle("warn", hintWarn);
    }

    function finish(winner) {
      var name = items[winner];
      resultName.textContent = name;
      resultName.style.setProperty("--win", colorFor(winner, items.length));
      overlay.hidden = false;
      document.getElementById("again").focus();
      live.textContent = S().result(name);
      setHint("hintAgain", false);
      chime();

      history.unshift(name);
      // 확률에 영향을 주는 만큼만 남긴다 — 보이는 것과 작동하는 것을 일치시킨다
      if (history.length > DECAY.length) history.length = DECAY.length;

      // 새 가중치로 조각 폭이 달라지므로, 당첨 조각이 계속 바늘 아래 오도록 맞춘다
      var after = layout();
      var at = items.indexOf(name);
      if (at !== -1) rot = norm(-(after.starts[at] + after.angle(at) / 2));

      renderHistory();
      render();
      save();
    }

    /* ── list ── */
    function addNames(raw) {
      var parts = String(raw).split(/[,\n\t]+/);
      var added = 0;
      var dupIndex = -1;

      parts.forEach(function (p) {
        var name = p.trim().replace(/\s+/g, " ").slice(0, MAX_NAME);
        if (!name) return;
        var at = items.indexOf(name);
        if (at !== -1) { dupIndex = at; return; }
        items.push(name);
        added++;
      });

      if (added) setHint(items.length < 2 ? "hintStart" : "hintReady", false);
      render();
      if (dupIndex !== -1) flashDup(dupIndex);
      return added;
    }

    function flashDup(index) {
      var chip = listEl.children[index];
      if (!chip) return;
      chip.classList.add("dup");
      setHint("hintDup", false);
      setTimeout(function () { chip.classList.remove("dup"); }, 360);
    }

    function remove(index) {
      items.splice(index, 1);
      render();
      save();
    }

    function render() {
      listEl.textContent = "";
      var n = items.length;
      var L = layout();
      // 가중치가 실제로 갈릴 때만 확률을 적는다
      var showOdds = weighted && L.w.some(function (x) { return x !== L.w[0]; });

      items.forEach(function (name, i) {
        var li = document.createElement("li");
        li.className = "chip";
        li.style.setProperty("--chip", colorFor(i, n));

        var span = document.createElement("span");
        span.className = "chip-name";
        span.textContent = name;

        var x = document.createElement("button");
        x.className = "chip-x";
        x.type = "button";
        x.textContent = "×";
        x.setAttribute("aria-label", S().remove(name));
        x.addEventListener("click", function () { remove(i); });

        li.appendChild(span);

        if (showOdds) {
          var odds = document.createElement("span");
          odds.className = "chip-odds";
          odds.textContent = Math.round(L.w[i] / L.total * 100) + "%";
          li.appendChild(odds);
        }

        li.appendChild(x);
        listEl.appendChild(li);
      });

      emptyEl.hidden = n > 0;
      countEl.textContent = S().count(n);
      shareOut.hidden = true;
      draw();
      save();
    }

    function renderHistory() {
      chipsEl.textContent = "";
      // 지우기는 늘 자리를 지키되, 지울 기록이 없으면 비활성
      clearHistBtn.disabled = !history.length;
      emptyHistEl.hidden = history.length > 0;

      history.forEach(function (name) {
        var el = document.createElement("span");
        el.className = "history-item";
        el.textContent = name;
        el.title = name;                 // 잘린 이름은 마우스를 올리면 전체가 보인다
        chipsEl.appendChild(el);
      });
    }

    /* ── language ── */
    function applyLang() {
      var s = S();
      document.documentElement.lang = lang;
      document.documentElement.setAttribute("data-lang", lang);
      document.title = s.title;

      Array.prototype.forEach.call(document.querySelectorAll("[data-i18n]"), function (el) {
        el.textContent = s[el.getAttribute("data-i18n")];
      });
      Array.prototype.forEach.call(document.querySelectorAll("[data-i18n-ph]"), function (el) {
        el.placeholder = s[el.getAttribute("data-i18n-ph")];
      });
      Array.prototype.forEach.call(document.querySelectorAll("[data-i18n-aria]"), function (el) {
        el.setAttribute("aria-label", s[el.getAttribute("data-i18n-aria")]);
      });

      var current = LANGS.filter(function (l) { return l.code === lang; })[0] || LANGS[1];
      langCode.textContent = current.short;
      Array.prototype.forEach.call(themeMenu.querySelectorAll("[data-theme-name]"), function (el) {
        var id = el.getAttribute("data-theme-name");
        el.textContent = (s.themes && s.themes[id]) || id;
      });
      Array.prototype.forEach.call(langMenu.children, function (item) {
        item.setAttribute("aria-checked", String(item.getAttribute("data-lang") === lang));
      });

      setBusy(spinning);
      setHint(hintKey, hintWarn);
      updateWeightBtn();
      readTheme();
      render();
      renderHistory();
    }

    function updateWeightBtn() {
      var s = S();
      weightBtn.textContent = s.weight + " · " + (weighted ? s.on : s.off);
      weightBtn.setAttribute("aria-pressed", String(weighted));
    }

    function setLang(code) {
      if (!STRINGS[code] || code === lang) return;
      lang = code;
      save();
      applyLang();
    }

    function pickLang() {
      var stored = null;
      try { stored = (JSON.parse(localStorage.getItem(STORE_KEY) || "{}")).lang; } catch (e) { /* 무시 */ }
      if (stored && STRINGS[stored]) return stored;

      var fromHash = /[#&]lang=([a-z]{2})/i.exec(location.hash || "");
      if (fromHash && STRINGS[fromHash[1].toLowerCase()]) return fromHash[1].toLowerCase();

      var list = navigator.languages || [navigator.language || "en"];
      for (var i = 0; i < list.length; i++) {
        var code = String(list[i]).slice(0, 2).toLowerCase();
        if (STRINGS[code]) return code;
      }
      return "en";
    }

    /* ─── 색상 테마 ─── */
    function themeById(id) {
      return THEMES.filter(function (t) { return t.id === id; })[0] || THEMES[0];
    }

    function applyTheme() {
      var t = themeById(theme);
      var root = document.documentElement;

      TOKEN_KEYS.forEach(function (k) { root.style.removeProperty("--" + k); });
      if (t.tokens) {
        Object.keys(t.tokens).forEach(function (k) { root.style.setProperty("--" + k, t.tokens[k]); });
      }
      root.setAttribute("data-palette", t.id);

      PALETTE = t.wedges || DEFAULT_WEDGES;
      readTheme();                      // 캔버스가 쓰는 색·폰트 값을 다시 읽는다
      render();                         // 조각과 칩 색 갱신
      updateThemeMenu();
    }

    function updateThemeMenu() {
      Array.prototype.forEach.call(themeMenu.children, function (card) {
        card.setAttribute("aria-checked", String(card.getAttribute("data-theme-id") === theme));
      });
    }

    function buildThemeMenu() {
      themeMenu.textContent = "";
      THEMES.forEach(function (t) {
        var wedges = t.wedges || DEFAULT_WEDGES;
        var ground = t.tokens ? t.tokens.ground : t.preview.ground;
        var accent = t.tokens ? t.tokens.accent : t.preview.accent;

        var card = document.createElement("button");
        card.type = "button";
        card.className = "theme-card";
        card.setAttribute("role", "menuitemradio");
        card.setAttribute("data-theme-id", t.id);
        card.setAttribute("aria-checked", "false");

        var swatch = document.createElement("span");
        swatch.className = "theme-swatch";
        swatch.style.background = ground;
        [wedges[0], wedges[3], wedges[5], accent].forEach(function (c) {
          var dot = document.createElement("i");
          dot.style.background = c;
          swatch.appendChild(dot);
        });

        var name = document.createElement("span");
        name.className = "theme-name";
        name.setAttribute("data-theme-name", t.id);

        card.appendChild(swatch);
        card.appendChild(name);
        card.addEventListener("click", function () {
          setTheme(t.id);
          closeThemeMenu(true);
        });
        themeMenu.appendChild(card);
      });
    }

    function setTheme(id) {
      if (id === theme) return;
      theme = id;
      applyTheme();
      save();
    }

    function openThemeMenu() {
      closeMenu(false);
      themeMenu.hidden = false;
      themeBtn.setAttribute("aria-expanded", "true");
      var checked = themeMenu.querySelector('[aria-checked="true"]');
      (checked || themeMenu.firstChild).focus();
    }

    function closeThemeMenu(refocus) {
      if (themeMenu.hidden) return;
      themeMenu.hidden = true;
      themeBtn.setAttribute("aria-expanded", "false");
      if (refocus) themeBtn.focus();
    }

    themeBtn.addEventListener("click", function () {
      if (themeMenu.hidden) openThemeMenu(); else closeThemeMenu(true);
    });

    document.addEventListener("click", function (e) {
      if (!themeMenu.hidden && !document.getElementById("theme-pick").contains(e.target)) closeThemeMenu(false);
    });

    function buildMenu() {
      LANGS.forEach(function (l) {
        var item = document.createElement("button");
        item.type = "button";
        item.className = "lang-item";
        item.setAttribute("role", "menuitemradio");
        item.setAttribute("data-lang", l.code);
        item.setAttribute("aria-checked", "false");
        item.lang = l.code;

        var name = document.createElement("span");
        name.textContent = l.name;
        var tick = document.createElement("span");
        tick.className = "tick";
        tick.textContent = "✓";

        item.appendChild(name);
        item.appendChild(tick);
        item.addEventListener("click", function () {
          setLang(l.code);
          closeMenu(true);
        });
        langMenu.appendChild(item);
      });
    }

    function openMenu() {
      closeThemeMenu(false);
      langMenu.hidden = false;
      langBtn.setAttribute("aria-expanded", "true");
      var checked = langMenu.querySelector('[aria-checked="true"]');
      (checked || langMenu.firstChild).focus();
    }

    function closeMenu(refocus) {
      if (langMenu.hidden) return;
      langMenu.hidden = true;
      langBtn.setAttribute("aria-expanded", "false");
      if (refocus) langBtn.focus();
    }

    langBtn.addEventListener("click", function () {
      if (langMenu.hidden) openMenu(); else closeMenu(true);
    });

    langMenu.addEventListener("keydown", function (e) {
      var items = Array.prototype.slice.call(langMenu.children);
      var at = items.indexOf(document.activeElement);
      if (e.key === "ArrowDown" || e.key === "ArrowUp") {
        e.preventDefault();
        var next = (at + (e.key === "ArrowDown" ? 1 : items.length - 1) + items.length) % items.length;
        items[next].focus();
      }
    });

    document.addEventListener("click", function (e) {
      if (!langMenu.hidden && !document.getElementById("lang").contains(e.target)) closeMenu(false);
    });

    /* ── storage & sharing ── */
    function save() {
      try {
        localStorage.setItem(STORE_KEY, JSON.stringify({
          items: items, history: history, lang: lang, weighted: weighted, theme: theme
        }));
      } catch (e) { /* 저장이 막혀 있어도 그냥 쓴다 */ }
    }

    function load() {
      lang = pickLang();

      var fromHash = readHash();
      if (fromHash) {
        items = fromHash;
        try {
          var keep = JSON.parse(localStorage.getItem(STORE_KEY) || "{}");
          history = Array.isArray(keep.history) ? keep.history.slice(0, DECAY.length) : [];
          if (typeof keep.weighted === "boolean") weighted = keep.weighted;
          if (keep.theme) theme = keep.theme;
        } catch (e) { /* 무시 */ }
        return;
      }
      try {
        var saved = JSON.parse(localStorage.getItem(STORE_KEY) || "{}");
        if (Array.isArray(saved.items)) items = saved.items.filter(function (s) { return typeof s === "string" && s; });
        if (Array.isArray(saved.history)) history = saved.history.slice(0, DECAY.length);
        if (typeof saved.weighted === "boolean") weighted = saved.weighted;
        if (saved.theme) theme = saved.theme;
      } catch (e) { /* 무시 */ }
    }

    function readHash() {
      var m = /[#&]r=([^&]*)/.exec(location.hash || "");
      if (!m) return null;
      try {
        var names = decodeURIComponent(m[1]).split("|")
          .map(function (s) { return s.trim().slice(0, MAX_NAME); })
          .filter(function (s) { return !!s; });
        var out = [];
        names.forEach(function (s) { if (out.indexOf(s) === -1) out.push(s); });
        return out.length ? out : null;
      } catch (e) { return null; }
    }

    function shareLink() {
      // 언어는 붙이지 않는다 — 받는 사람의 브라우저 언어로 열리는 편이 낫다
      var base = location.href.split("#")[0];
      return base + "#r=" + encodeURIComponent(items.join("|"));
    }

    /* ── events ── */
    document.getElementById("add-form").addEventListener("submit", function (e) {
      e.preventDefault();
      if (addNames(input.value)) input.value = "";
      input.focus();
    });

    spinBtn.addEventListener("click", spin);
    hub.addEventListener("click", spin);

    document.getElementById("clear").addEventListener("click", function () {
      if (!items.length) return;
      items = [];
      render();
      setHint("hintStart", false);
    });

    clearHistBtn.addEventListener("click", function () {
      if (!history.length) return;
      history = [];
      renderHistory();
      render();                                   // 가중치가 사라지므로 조각과 확률 표시를 다시 그린다
      setHint("hintHistoryCleared", false);
      save();
    });

    infoBtn.addEventListener("click", function () {
      var open = historyNote.hidden;
      historyNote.hidden = !open;
      infoBtn.setAttribute("aria-expanded", String(open));
    });

    weightBtn.addEventListener("click", function () {
      weighted = !weighted;
      updateWeightBtn();
      setHint(weighted ? "hintWeightOn" : "hintWeightOff", false);
      render();
      save();
    });

    shareBtn.addEventListener("click", function () {
      if (!items.length) {
        setHint("hintNoShare", true);
        return;
      }
      var url = shareLink();
      function fallback() {
        shareOut.hidden = false;
        shareOut.value = url;
        shareOut.select();
        shareBtn.textContent = S().shareManual;
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(function () {
          shareBtn.textContent = S().shareDone;
          setTimeout(function () { shareBtn.textContent = S().share; }, 1800);
        }, fallback);
      } else {
        fallback();
      }
    });

    function closeResult() {
      overlay.hidden = true;
      spinBtn.focus();
    }

    document.getElementById("close").addEventListener("click", closeResult);
    document.getElementById("again").addEventListener("click", function () {
      closeResult();
      spin();
    });

    document.getElementById("exclude").addEventListener("click", function () {
      var at = items.indexOf(resultName.textContent);
      if (at !== -1) remove(at);
      closeResult();
      if (items.length >= 2) spin();
      else setHint("hintFew", true);
    });

    overlay.addEventListener("click", function (e) {
      if (e.target === overlay) closeResult();
    });

    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && !themeMenu.hidden) closeThemeMenu(true);
      else if (e.key === "Escape" && !langMenu.hidden) closeMenu(true);
      else if (e.key === "Escape" && !overlay.hidden) closeResult();
      if (e.key === " " && e.target === document.body) { e.preventDefault(); spin(); }
    });

    window.addEventListener("resize", sizeCanvas);
    window.addEventListener("hashchange", function () {
      var next = readHash();
      if (next) { items = next; render(); }
    });

    var dark = window.matchMedia("(prefers-color-scheme: dark)");
    if (dark.addEventListener) dark.addEventListener("change", function () { readTheme(); draw(); });

    /* ── boot ── */
    readTheme();
    load();
    buildMenu();
    buildThemeMenu();
    applyTheme();
    hintKey = items.length >= 2 ? "hintReady" : "hintStart";
    applyLang();
    sizeCanvas();
  })();
</script>
</body>
</html>
